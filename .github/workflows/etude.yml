name: Yanis - modele a l'etude

on:
  schedule:
    - cron: "24 1,7,13,19 * * *"   # verification sur 9 ans, 4 fois par jour (les paris eux-memes sont calcules par le robot rapide)
  workflow_dispatch:
  push:
    paths:
      - modele_etude.py
      - .github/workflows/etude.yml

permissions:
  contents: write

concurrency:
  group: etude
  cancel-in-progress: false

jobs:
  etude:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Radar a outsiders - verification par discipline sur tout l'historique"
        run: |
          pip install --quiet numpy pandas scipy scikit-learn
          python modele_etude.py --verifier
      - name: Publier
        run: |
          git config user.name "Yanis"
          git config user.email "yanis@users.noreply.github.com"
          git add docs/data/etude_fiabilite.json
          git diff --cached --quiet || git commit -q -m "Etude du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3 4 5; do if git pull --rebase -X theirs --quiet && git push --quiet; then break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
