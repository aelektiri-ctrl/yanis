name: Yanis - gardien (relance le robot rapide s'il est arrete)

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  gardien:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verifier et relancer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          actifs=$(gh run list -R $R --workflow rapide.yml -L 5 --json status -q '[.[]|select(.status!="completed")]|length')
          dernier=$(gh run list -R $R --workflow rapide.yml -L 1 --json createdAt -q '.[0].createdAt')
          age=$(( $(date +%s) - $(date -d "$dernier" +%s) ))
          echo "en cours: $actifs ; dernier lancement il y a $((age/60)) min"
          if [ "$actifs" = "0" ] && [ $age -gt 1200 ]; then gh workflow run rapide.yml --ref main -R $R && echo "robot relance"; fi
