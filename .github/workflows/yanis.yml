name: Yanis - collecte PMU

on:
  schedule:
    - cron: "7 * * * *"    # chaque heure : courses du jour, cotes, resultats, puis historique
  workflow_dispatch:       # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write

concurrency:
  group: yanis
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Football (bibliotheque, modele, banc d'essai)
        continue-on-error: true
        run: |
          pip install --quiet numpy scipy
          python sport.py
      - name: Courses PMU (40 minutes maximum)
        run: python yanis.py collecte --budget 40
      - name: Preparer l'appli
        run: python yanis.py publier
      - name: Enregistrer dans la bibliotheque
        run: |
          git config user.name "Yanis"
          git config user.email "yanis@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Collecte du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          git pull --rebase --quiet || true
          git push
