name: Yanis - collecte PMU

on:
  schedule:
    - cron: "7 * * * *"    # chaque heure : courses du jour, cotes, resultats, puis historique
  workflow_dispatch:       # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write
  actions: write

concurrency:
  group: yanis
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Football (bibliotheque, modele, banc d'essai)
        continue-on-error: true
        run: |
          pip install --quiet numpy scipy
          python sport.py
      - name: NBA, NHL, NFL, MLB, tennis, UFC (bibliotheque, Elo, banc d'essai)
        continue-on-error: true
        run: python sports.py --budget 10
      - name: Publier le sport tout de suite
        run: |
          git config user.name "Yanis"
          git config user.email "yanis@users.noreply.github.com"
          git add -A donnees_sport docs/data
          git diff --cached --quiet || git commit -q -m "Sport du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          git pull --rebase --quiet || true
          git push || true
      - name: Courses PMU (30 minutes maximum)
        run: python yanis.py collecte --budget 30
      - name: Modele hippique v2 (banc d'essai une fois par jour, pronostics a chaque passage)
        continue-on-error: true
        run: |
          pip install --quiet pandas scikit-learn
          python modele_hippique.py --banc-si-ancien
      - name: Preparer l'appli
        run: python yanis.py publier
      - name: Enregistrer dans la bibliotheque
        run: |
          git config user.name "Yanis"
          git config user.email "yanis@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Collecte du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          git pull --rebase --quiet || true
          git push
      - name: Relancer le passage suivant (filet de securite si l'horloge GitHub ne se declenche pas)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 600
          gh workflow run yanis.yml --ref main -R ${{ github.repository }} || true
