name: Yanis - releve des paris detailles (en test)

on:
  schedule:
    - cron: "40 10 * * *"
    - cron: "40 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yanis-sharp
  cancel-in-progress: false

jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: "Releve (40 credits maximum)"
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node cotes_detail.js 40
      - name: Enregistrer
        run: |
          git config user.name "Yanis"
          git config user.email "yanis@users.noreply.github.com"
          git add docs/data/detail.json donnees_cotes/detail 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Paris detailles du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3 4 5; do if git pull --rebase -X theirs --quiet && git push --quiet; then break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
