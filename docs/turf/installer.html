<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Installer Turf 70%</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a2e22">
<style>
body{margin:0;background:#0a2e22;color:#fff;font:bold 30px/1.3 system-ui,sans-serif;text-align:center;padding:24px}
img{width:180px;height:180px;border-radius:36px;margin:10px auto 20px;display:block}
a,button{display:block;width:100%;box-sizing:border-box;margin:22px 0;padding:34px 10px;border:0;border-radius:24px;font:inherit;font-size:34px;color:#0a2e22;background:#f2c94c;text-decoration:none}
#z{background:#b14cff;color:#fff}
p{font-size:24px;font-weight:normal;opacity:.9}
</style></head><body>
<img src="icon-512.png?v=4" alt="">
<button id="i">1. INSTALLER TURF 70%</button>
<p id="m"></p>
<a id="z" href="https://github.com/aelektiri-ctrl/zazou/releases/download/beta-23/Zazou.apk">2. RÉINSTALLER ZAZOU</a>
<p>Après le bouton 2 : touche le fichier téléchargé, puis « Installer ».</p>
<script>
var ev=null,m=document.getElementById('m');
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;m.textContent='Prêt : touche le bouton 1.'});
document.getElementById('i').onclick=function(){
  if(ev){ev.prompt();ev.userChoice.then(function(r){m.textContent=r.outcome==='accepted'?'✅ Turf 70% installée.':'Installation annulée.'})}
  else m.textContent='Touche les 3 points en haut à droite, puis « Installer l\'application ».';
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
