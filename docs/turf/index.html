<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turf Analyste</title>
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14;--surface:#121821;--surface2:#171f2a;--raise:#1d2733;--line:#232e3b;--line2:#2c3949;--ink:#e7ecf2;--ink2:#c3ccd7;--mute:#8693a4;
--accent:#4c8dff;--accent-ink:#ffffff;--accent-soft:rgba(76,141,255,.12);--good:#2fb67c;--good-soft:rgba(47,182,124,.12);--bad:#e5484d;--bad-soft:rgba(229,72,77,.12);--warn:#d39b2a;--warn-soft:rgba(211,155,42,.13);
--sec:#2fb67c;--fort:#4c8dff;--doute:#8693a4;--chip:#171f2a;--r:10px;
--font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:var(--font)}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--surface:#ffffff;--surface2:#f7f9fb;--raise:#eef2f6;--line:#e2e7ee;--line2:#d5dce5;--ink:#111827;--ink2:#2d3748;--mute:#5d6878;
--accent:#1f5fd6;--accent-soft:rgba(31,95,214,.08);--good:#13804f;--good-soft:rgba(19,128,79,.08);--bad:#c62f34;--bad-soft:rgba(198,47,52,.08);--warn:#a86d00;--warn-soft:rgba(168,109,0,.09);--sec:#13804f;--fort:#1f5fd6;--doute:#5d6878;--chip:#eef2f6}}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font:14.5px/1.5 var(--font);font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);min-height:100vh}
header{position:sticky;top:0;z-index:5;padding:env(safe-area-inset-top) 16px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px}
h1{font-size:16px;white-space:nowrap;margin:0;font-weight:700;letter-spacing:-.2px;color:var(--ink)}
h1 span{color:var(--mute);font-weight:500}h1 small{color:var(--mute);font-weight:500;font-family:var(--mono);font-size:10.5px!important;margin-left:4px}
.datebar{display:flex;align-items:center;gap:4px}.datebar button{padding:5px 9px;font-size:13px}
#bell svg{width:15px;height:15px;vertical-align:-3px}
button{font:inherit;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--line2)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.status{font-size:11.5px;color:var(--mute);margin:6px 0 6px;display:flex;justify-content:space-between;gap:8px}
#upd{font-family:var(--mono)}
.bar{height:2px;background:var(--line);overflow:hidden;margin:0 -16px}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.modes{display:flex;gap:0;margin:10px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.modes button{flex:1;font-weight:600;font-size:13px;padding:7px 4px;border:0;border-radius:7px;background:none;color:var(--mute)}
.modes button.on{background:var(--raise);color:var(--ink)}
nav{display:flex;gap:4px;margin-top:4px}nav[hidden]{display:none}
nav button{flex:1;background:none;border:0;border-radius:0;border-bottom:2px solid transparent;color:var(--mute);padding:9px 4px;font-weight:600;font-size:13px}
nav button.on{color:var(--ink);border-color:var(--accent)}
#bellN{display:inline-block;font-size:10px;margin-left:3px;color:var(--bad);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}.chips button{white-space:nowrap;font-size:12.5px;padding:5px 11px;border-radius:7px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 40px);max-width:760px;margin:0 auto}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.card.is-live{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.card.hl{border-color:var(--line2)}
.tap{cursor:pointer}.tap:active{background:var(--surface2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ttl{font-weight:600}.mute{color:var(--mute);font-size:12.5px}
.mono{font-family:var(--mono);font-size:12.5px}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.4px;padding:2px 7px;border-radius:5px;white-space:nowrap;border:1px solid currentColor;background:none}
.SEC{color:var(--sec)}.FORT{color:var(--fort)}.DOUTE{color:var(--doute)}.NA{color:var(--mute);opacity:.8}.LOUP{color:var(--warn)}
.livesim{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12.5px;color:var(--mute)}.livesim b{color:var(--ink)}
.simbar{display:grid;grid-template-columns:48px 1fr 44px;align-items:center;gap:8px;font-size:12.5px;margin:3px 0}.simbar i{display:block;height:6px;border-radius:3px;background:var(--accent)}.simbar b{text-align:right;font-weight:600}
.risk{font-size:12px;color:var(--mute);margin-top:5px}
.vgrid{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;margin:10px 0 6px}.vgrid div{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center}.vgrid span{display:block;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}.vgrid b{font-size:18px;font-weight:600}.vgrid .win b{color:var(--good)}.vgrid .lose b{font-size:15px}
.ev{font-size:12.5px;margin:4px 0;color:var(--ink2)}
.card.pn.bad{box-shadow:inset 3px 0 0 var(--bad)}.card.pn.good{box-shadow:inset 3px 0 0 var(--good)}.card.pn.wolfc,.card.vcard{box-shadow:inset 3px 0 0 var(--warn)}
.wolf{display:block;margin:8px 0 2px;padding:6px 9px;border-radius:7px;font-size:12px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.wolf.strong{background:var(--warn-soft);color:var(--ink);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.odds{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);margin-top:7px}.odds b{color:var(--ink);font-family:var(--mono);font-weight:600}
.lprop{margin-top:7px;padding:7px 9px;border-radius:7px;background:var(--accent-soft);font-size:12.5px}.lprop b{color:var(--ink)}
.warn{color:var(--warn);font-weight:600}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:3px 12px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}.prow:first-of-type{border-top:0}.prow b{font-family:var(--mono);font-weight:600}.prow .adv{grid-column:1/-1;font-size:11.5px}
.pts{padding:8px 0;border-top:1px solid var(--line)}
.tiers{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.tiers span{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);color:var(--mute);font-family:var(--mono)}.tiers span.mid{color:var(--warn)}.tiers span.hi{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}.tiers b{color:inherit;font-weight:600}
.combo{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.combo b{color:var(--mute);font-weight:500}.combo .cm{font-family:var(--mono);color:var(--ink);font-weight:600}
.rmini{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--mute);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}.rmini em{font-style:normal;color:var(--mute);width:100%;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}.rmini b{color:var(--ink);font-family:var(--mono);font-weight:600}
.rtab .rh,.rtab .rr{display:grid;grid-template-columns:1.6fr 1fr auto;gap:8px;padding:7px 0;align-items:center;font-size:13px}
.rtab .rh{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;padding-top:0}.rtab .rh span:last-child{text-align:right}
.rtab .rr{border-top:1px solid var(--line)}.rtab .rr b{font-family:var(--mono);font-weight:600;text-align:right}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mute);margin-top:6px}.kv span:last-child{text-align:right}.kv b{color:var(--ink)}
.big{font-size:16px;font-weight:600;margin:6px 0 2px;letter-spacing:-.1px}
.conf{font-family:var(--mono);font-weight:600;color:var(--ink)}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--accent)}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:20px 0 8px;font-weight:600}
.reu{margin-bottom:14px}.reu>.row{padding:4px 2px 8px}
.crow{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.crow:first-of-type{border-top:0}
.crow .h{font-family:var(--mono);font-weight:600;width:44px;color:var(--ink2);padding-top:1px}.crow .m{flex:1;min-width:0}.crow .m>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--good);font-weight:600}.ko{color:var(--bad);font-weight:600}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 40px)}
#sheet.open{display:block}#sheet .in{max-width:760px;margin:0 auto}
.jeu{border:1px solid var(--line);padding:9px 11px;margin:6px 0;background:var(--surface);border-radius:8px}
.jeu.main{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.horse{border-top:1px solid var(--line);padding:10px 0}.horse:first-child{border-top:0}
.hn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-family:var(--mono);font-size:13px;margin-right:9px;flex:none}
.hn.b{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.why{margin:6px 0 0 37px;padding:0;list-style:none;font-size:12.5px;color:var(--ink2)}.why li{margin:2px 0}.why .p{color:var(--good)}.why .n{color:var(--bad)}
.err{border-color:var(--bad)}
.foot{font-size:11.5px;color:var(--mute);text-align:center;margin-top:24px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}.kpis b{display:block;font-size:19px;font-weight:600;font-family:var(--mono)}
.mk{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}.mk:first-child{border-top:0}
.alert{border:1px solid var(--line);padding:9px 11px;margin:6px 0;background:var(--surface);border-radius:8px;font-size:13.5px}
.inj{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}.inj:first-child{border-top:0}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--mute);margin:4px 3px 0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.chip{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;letter-spacing:.3px}
.chip.live{color:var(--bad);background:var(--bad-soft)}.chip.fin{color:var(--mute);background:var(--surface2)}.chip.pre{color:var(--ink2);background:var(--surface2);font-family:var(--mono)}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:10px 0 8px}
.board .tm{font-weight:600;font-size:14.5px;line-height:1.25}.board .tm.r{text-align:right}
.sc{font-size:20px;font-weight:600;font-family:var(--mono);white-space:nowrap;color:var(--ink)}
.vs{font-size:12px;color:var(--mute)}
.big2 .sc{font-size:28px}
.prono{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 0 0;margin-top:2px;font-size:13.5px;font-weight:500}
.tv{font-size:12px;color:var(--mute);margin-top:6px}
.strip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin:0 0 6px;background:var(--surface2);color:var(--mute);letter-spacing:.2px}
.strip.live{color:var(--bad);background:var(--bad-soft)}.strip.soon{color:var(--warn);background:var(--warn-soft)}.strip.fin{color:var(--good);background:var(--good-soft)}
.crow .strip{margin:5px 0 0}
.btn-eq{display:block;text-align:center;margin:10px 0 4px;padding:10px;border-radius:8px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--surface);border:1px solid var(--line2)}
.money{text-align:center}.money.up .big{color:var(--good)}.money.down .big{color:var(--bad)}
a{color:var(--accent)}
.card.fin{padding:10px 14px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Turf <span>Analyste</span> <small style="font-size:11px;font-weight:700">v28</small></h1>
    <div class="datebar"><button id="bell" aria-label="Alertes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><b id="bellN"></b></button><button id="prev" aria-label="Jour précédent">‹</button><button id="today">Auj.</button><button id="next" aria-label="Jour suivant">›</button></div>
  </div>
  <div class="status"><span id="st">Prêt</span><span id="upd"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="modes"><button data-m="turf" class="on">Turf</button><button data-m="sport">Sport</button><button data-m="value">Points noirs</button></div>
  <nav id="navTurf"><button data-t="sel" class="on">Sélections</button><button data-t="prog">Programme</button><button data-t="bilan">Bilan</button></nav>
  <nav id="navValue" hidden><button class="on">Faux favoris · loups · cotes trop belles</button></nav>
  <nav id="navSport" hidden><button data-t="top" class="on">Sélection</button><button data-t="list">Matchs</button><button data-t="sbilan">Bilan</button></nav>
</header>
<main id="view"></main>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<script>
/* Turf Analyste — moteur d'analyse hippique
   Entrées : une course du programme PMU + sa liste de participants.
   Sorties : probabilités par cheval, simulations d'arrivée, niveau de confiance,
   jeux proposés (sec / champ réduit / 2 sur 4) et explications. */
(function (root) {
  'use strict';

  var SPEC_LETTER = { TROT_ATTELE: 'a', TROT_MONTE: 'm', PLAT: 'p', HAIE: 'h', STEEPLECHASE: 's', CROSS: 'c' };
  var POS_PTS = { '1': 10, '2': 8, '3': 6.5, '4': 5, '5': 4, '6': 3, '7': 2, '8': 1.5, '9': 1, '0': 0.5, 'D': 0, 'A': 0, 'T': 0, 'R': 0.5, 'N': 0.5 };

  // ---------- utilitaires ----------
  function num(v) { var n = +v; return isFinite(n) ? n : null; }
  function mean(a) { var s = 0, n = 0; a.forEach(function (x) { if (x != null) { s += x; n++; } }); return n ? s / n : null; }
  function sd(a, m) { var s = 0, n = 0; a.forEach(function (x) { if (x != null) { s += (x - m) * (x - m); n++; } }); return n > 1 ? Math.sqrt(s / (n - 1)) : 0; }
  function zscores(a) {
    var m = mean(a); if (m == null) return a.map(function () { return 0; });
    var s = sd(a, m) || 1;
    return a.map(function (x) { return x == null ? 0 : Math.max(-2.5, Math.min(2.5, (x - m) / s)); });
  }
  function normalize(a) { var s = a.reduce(function (x, y) { return x + y; }, 0) || 1; return a.map(function (x) { return x / s; }); }
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function comb(n, k) { if (k < 0 || k > n) return 0; var r = 1; for (var i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }
  function pct(x) { return Math.round(x * 100) + ' %'; }
  function fmtCote(c) { return !c ? '—' : (c < 10 ? c.toFixed(1) : Math.round(c)).toString().replace('.', ','); }

  // ---------- musique ----------
  function parseMusique(m) {
    var out = []; if (!m) return out;
    var re = /\((\d{2})\)|([0-9DATRN])([a-z])/g, x, year = 0;
    while ((x = re.exec(m))) { if (x[1]) { year++; continue; } out.push({ pos: x[2], disc: x[3], old: year > 0 }); }
    return out;
  }
  function formFromMusique(tokens, disc) {
    var w = [1, 0.85, 0.72, 0.6, 0.5, 0.42], s = 0, ws = 0, sd2 = 0, wsd = 0, faults = 0;
    tokens.slice(0, 6).forEach(function (t, i) {
      var p = POS_PTS[t.pos] != null ? POS_PTS[t.pos] : 1, wi = w[i] * (t.old ? 0.8 : 1);
      s += p * wi; ws += wi; if (t.disc === disc) { sd2 += p * wi; wsd += wi; }
    });
    tokens.slice(0, 5).forEach(function (t) { if ('DAT'.indexOf(t.pos) >= 0) faults++; });
    return { form: ws ? s / ws : null, formDisc: wsd ? sd2 / wsd : null, faults: faults, recent: tokens.slice(0, 5).map(function (t) { return t.pos; }) };
  }

  // ---------- caractéristiques d'un partant ----------
  function isTrot(course) { return /TROT/.test(course.specialite || '') || /TROT/.test(course.discipline || ''); }
  function isPlat(course) { return (course.specialite || '') === 'PLAT'; }

  function extract(p, course) {
    var disc = SPEC_LETTER[course.specialite] || '';
    var mus = parseMusique(p.musique || '');
    var f = formFromMusique(mus, disc);
    var nc = num(p.nombreCourses) || 0, nv = num(p.nombreVictoires) || 0, npl = num(p.nombrePlaces) || 0;
    var g = p.gainsParticipant || {};
    var gainsCar = (num(g.gainsCarriere) || 0) / 100, gainsAn = (num(g.gainsAnneeEnCours) || 0) / 100;
    var rd = p.dernierRapportDirect || {}, rr = p.dernierRapportReference || {};
    var cote = num(rd.rapport), coteRef = num(rr.rapport);
    var poids = num(p.handicapPoids) || num(p.poidsConditionMonte);
    if (poids != null && poids > 200) poids = poids / 10; // hectogrammes -> kg
    var recul = null;
    if (isTrot(course) && num(p.handicapDistance) && num(course.distance)) recul = num(p.handicapDistance) - num(course.distance);
    return {
      num: num(p.numPmu), nom: p.nom || ('N°' + p.numPmu), age: num(p.age), sexe: p.sexe,
      driver: (p.driver || p.jockey || ''), entraineur: p.entraineur || '', driverChange: !!p.driverChange,
      musique: p.musique || '', mus: mus, f: f, nc: nc, nv: nv, npl: npl,
      inedit: !!p.indicateurInedit || nc === 0,
      gainsCar: gainsCar, gainsAn: gainsAn, gps: nc ? gainsCar / nc : null,
      cote: cote, coteRef: coteRef, favori: !!rd.favoris,
      deferre: p.deferre || '', avis: p.avisEntraineur || '', oeil: p.oeilleres || '',
      corde: num(p.placeCorde), poids: poids, recul: recul,
      arrivee: num(p.ordreArrivee),
      py: num(p.proba), pyMarche: num(p.proba_marche), stD: p.st_driver || null, stT: p.st_entraineur || null,
      suivi: p.cotes_suivies || null, incident: p.incident || '', pere: p.pere || '', valueY: !!p.value
    };
  }

  // ---------- performances détaillées ----------
  function fmtRK(rk) { var m = Math.floor(rk / 60000), sec = (rk % 60000) / 1000; return m + "'" + sec.toFixed(1).replace('.', '"'); }

    if(x.value)h+='<div class="jeu"><div class="row"><span class="ttl">Pari value : '+esc(x.value.label)+'</span><span class="conf">'+E.pct(x.value.p)+'</span></div><div class="mute">Cote '+x.value.dec.toFixed(2).replace('.',',')+' : le marché sous-estime cette issue.</div></div>';
    if(x.enr){
      var en=x.enr,names=[x.home,x.away];
      h+='<h2>Dernière minute <span class="mute" style="text-transform:none;letter-spacing:0">· MAJ '+new Date(en.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</span></h2><div class="card">';
      if(en.abs){[0,1].forEach(function(k){var t=en.abs[k];h+='<div class="ttl" style="margin-top:'+(k?'10':'0')+'px">'+esc(names[k])+' : '+(t.list.length?t.list.length+' joueur(s) signalé(s)':'aucune absence signalée')+'</div>';t.list.slice(0,10).forEach(function(p){h+='<div class="inj"><span>'+(p.key?'⭐ ':'')+esc(p.name)+(p.pos?' <span class="mute">'+esc(p.pos)+'</span>':'')+'</span><span class="mute">'+esc(p.status)+(p.detail?' · '+esc(p.detail):'')+'</span></div>'})})}
      else h+='<div class="mute">Pas de rapport de blessures publié pour ce match.</div>';
      if(en.lineups){h+='<div class="ttl" style="margin-top:10px">Compositions officielles</div>';[0,1].forEach(function(k){h+='<div class="mute" style="margin-top:4px"><b>'+esc(names[k])+'</b>'+(en.lineups[k].formation?' ('+esc(en.lineups[k].formation)+')':'')+' : '+esc(en.lineups[k].starters.join(', '))+'</div>'})}
      else if(x.sport==='foot')h+='<div class="mute" style="margin-top:8px">Compositions pas encore publiées (en général 1 h avant le coup d\'envoi).</div>';
      if(en.bpi!=null)h+='<div class="mute" style="margin-top:8px">Prédicteur ESPN : '+esc(x.home)+' '+E.pct(en.bpi)+'</div>';
      if(en.form5)h+='<div class="mute">Forme 5 derniers matchs : '+esc(x.home)+' '+esc(en.form5[0]||'—')+' · '+esc(x.away)+' '+esc(en.form5[1]||'—')+'</div>';
      h+='</div>';
    }
    if(x.sport==='foot'&&!x.state.done){
      h+='<h2>⚽ Buteurs potentiels'+(x.state.state==='in'?' (temps restant)':'')+'</h2><div class="card">';
      if(x.buteursEq&&x.buteursEq.some(function(t){return t.list.length})){
        h+='<div class="mute" style="margin-bottom:6px">Chance de marquer = sa part des buts de son équipe cette saison (buts réellement marqués dans la compétition, les plus récents comptent plus) × buts attendus de son équipe dans ce match'+(x.enr&&x.enr.lineups?', composition officielle prise en compte':'')+'. Cote mini = cote à exiger.</div>';
        x.buteursEq.forEach(function(t){h+='<div class="ttl" style="margin-top:8px">'+esc(t.team)+'</div>';if(!t.list.length)h+='<div class="mute">Pas encore de buteur enregistré.</div>';t.list.forEach(function(b){h+='<div class="prow"><span>'+esc(b.name)+' <span class="mute">'+b.goals+' but'+(b.goals>1?'s':'')+(b.pen?' dont '+b.pen+' pen.':'')+(b.starter===false?' · remplaçant':b.starter?' · titulaire':'')+'</span></span><b>'+E.pct(b.p)+'</b><span class="mute">mini '+fair(b.p)+'</span></div>'})});
      }
      else if(x.buteurs&&x.buteurs.length){h+='<div class="mute" style="margin-bottom:6px">Chance de marquer = part des buts de l\'équipe marqués par le joueur cette saison × buts attendus de son équipe dans ce match'+(x.enr&&x.enr.lineups?', composition officielle prise en compte':', composition pas encore connue')+'. Cote mini = cote à exiger chez ton opérateur.</div>';
        x.buteurs.forEach(function(b){var ad=advice(b.p);h+='<div class="prow"><span>'+esc(b.name)+' <span class="mute">'+esc(b.team)+' · '+b.goals+' but'+(b.goals>1?'s':'')+(b.starter===false?' · remplaçant':b.starter?' · titulaire':'')+'</span></span><b>'+E.pct(b.p)+'</b><span class="mute">mini '+fair(b.p)+'</span></div>'})}
      else h+='<div class="mute">Classement des buteurs indisponible pour cette compétition dans la source gratuite.</div>';
      h+='</div>';
    }
    if(x.points&&!x.state.done){
      h+='<h2>🏀 Points par joueur'+(x.state.state==='in'?' (en direct)':'')+'</h2><div class="card"><div class="mute" style="margin-bottom:6px">Chance de dépasser chaque palier, d\'après sa moyenne'+(x.ou?' et le rythme attendu du match (total '+String(x.ou).replace('.',',')+')':'')+'. Palier conseillé = le plus haut qui passe au moins 70 % du temps.</div>';
      x.points.forEach(function(t){h+='<div class="ttl" style="margin-top:8px">'+esc(t.team)+'</div>';if(!t.list.length)h+='<div class="mute">Statistiques indisponibles.</div>';
        t.list.forEach(function(p){h+='<div class="pts"><div class="row"><span><b>'+esc(p.name)+'</b> <span class="mute">moy. '+p.mean.toFixed(1).replace('.',',')+(p.now!=null?' · déjà '+p.now+' pts':'')+'</span></span><span class="'+(p.best?'ok':'mute')+'">'+(p.best?'🎯 '+p.best[0]+'+ pts · '+E.pct(p.best[1]):'pas de palier sûr')+'</span></div><div class="tiers">'+p.tiers.map(function(q){return '<span class="'+(q[1]>=0.7?'hi':q[1]>=0.5?'mid':'')+'">'+q[0]+'+ <b>'+E.pct(q[1])+'</b></span>'}).join('')+'</div></div>'})});
      h+='</div>';
    }
    if(x.sport==='foot'&&!x.state.done&&x.lam){var BB=null;try{BB=SportEngine.buildFor(x)}catch(e){}
      if(BB){var bl=function(t,arr,ico){if(!arr.length)return '';var o='<div class="ttl" style="margin-top:8px">'+ico+' '+t+'</div>';arr.forEach(function(c){o+='<div class="combo"><div>'+c.legs.map(esc).join(' <b>+</b> ')+'</div><div class="row"><span class="ok">'+E.pct(c.p)+'</span><span class="mute">cote mini <b class="cm">'+fair(c.p)+'</b></span></div></div>'});return o};
        h+='<h2>🧩 Montages de paris'+(x.state.state==='in'?' (à l\'instant T)':'')+'</h2><div class="card"><div class="mute">Chaque montage est vérifié sur 20 000 matchs simulés minute par minute (but, minute, équipe, buteur) : les liens entre les paris sont pris en compte. Ton opérateur doit proposer au moins la cote mini, sinon passe.</div>'+bl('Le plus sûr',BB.sur,'🟢')+bl('Équilibré',BB.equilibre,'🟠')+bl('Grosse cote',BB.grosse,'🔴');
        if(BB.singles.length){h+='<div class="ttl" style="margin-top:8px">⏱️ Premier but et premier buteur</div>';BB.singles.forEach(function(l){h+='<div class="prow"><span>'+esc(l.label)+'</span><b>'+E.pct(l.p)+'</b><span class="mute">mini '+fair(l.p)+'</span></div>'})}
        h+='</div>';}}
    if(x.sim){var S2=x.sim,lv=x.state.state==='in';
      h+='<h2>'+(lv?'📡 Simulation en direct':'🎲 Simulation avant-match')+' ('+S2.n.toLocaleString('fr-FR')+' '+(x.sport==='tennis'?'matchs':x.sport==='foot'?'matchs':'matchs')+')</h2><div class="card">';
      if(lv&&S2.r!=null)h+='<div class="mute">Le reste du match ('+Math.round(S2.r*100)+' % du temps de jeu) est rejoué '+S2.n.toLocaleString('fr-FR')+' fois à partir du score actuel.</div>';
      if(lv&&x.sport==='tennis')h+='<div class="mute">La fin du match est rejouée '+S2.n.toLocaleString('fr-FR')+' fois à partir du score actuel (sets gagnés et jeux du set en cours).</div>';
      h+='<div class="mk"><span>'+esc(x.main.label)+'</span><span class="conf">'+E.pct(S2.main)+'</span></div>';
      if(S2.comeback!=null){var trail=x.live[0]<x.live[1]?x.home:x.away;h+='<div class="mk"><span>'+esc(trail)+' revient au moins au nul</span><span class="conf">'+E.pct(S2.comeback)+'</span></div>'}
      if(x.sport==='foot')h+='<div class="mute" style="margin:4px 0">Simulation minute par minute'+(lv?' depuis la '+S2.minute+'e':'')+' : rythme de buts croissant en fin de match, l\'équipe menée accélère (encore plus si c\'est la favorite), celle qui mène gère'+(S2.notes&&S2.notes.length?', '+esc(S2.notes.join(', ')):'')+'.</div>';
      if(x.sport==='foot')h+='<div class="mk"><span>'+esc(x.home)+' / Nul / '+esc(x.away)+'</span><span>'+E.pct(S2.p[0])+' · '+E.pct(S2.p[1])+' · '+E.pct(S2.p[2])+'</span></div>';
      else h+='<div class="mk"><span>Victoire '+esc(x.home)+' / '+esc(x.away)+'</span><span>'+E.pct(S2.p[0])+' · '+E.pct(S2.p[2])+'</span></div>';
      if(S2.top&&S2.top.length){h+='<div class="mute" style="margin-top:6px">'+(S2.margin?'Écarts finaux les plus fréquents ('+esc(x.home)+')':'Scores finaux les plus fréquents')+' :</div>';S2.top.forEach(function(t){var lab=S2.margin?((+t[0]>0?'+':'')+t[0]):t[0];h+='<div class="simbar"><span>'+esc(lab)+'</span><i style="width:'+Math.round(t[1]/S2.top[0][1]*100)+'%"></i><b>'+E.pct(t[1])+'</b></div>'})}
      if(S2.props&&S2.props.length){var PP=S2.props.slice().filter(function(q){return q.p>=0.03&&q.p<=0.985}).sort(function(a,b){return b.p-a.p});
        h+='</div><h2>💡 Propositions '+(lv?'à l\'instant T (minute '+(S2.minute!=null?S2.minute:'')+')':'avant-match')+'</h2><div class="card"><div class="mute" style="margin-bottom:6px">« Cote mini » = la cote à partir de laquelle le pari devient rentable. Si ton opérateur propose plus, c\'est un bon pari ; moins, passe ton tour.</div>';
        PP.forEach(function(q){var ad=advice(q.p);h+='<div class="prow"><span>'+esc(q.label)+'</span><b>'+E.pct(q.p)+'</b><span class="mute">mini '+fair(q.p)+'</span><span class="'+ad.c+' adv">'+ad.t+'</span></div>'});
      }
      var hs=SP.hist[hk(x)];if(lv&&hs&&hs.length>1)h+='<div class="mute" style="margin-top:6px">Évolution en direct : '+hs.slice(-12).map(function(v){return Math.round(v*100)}).join(' → ')+' %</div>';
      h+='</div>';
    }
    h+='<h2>Pourquoi</h2><div class="card">'+x.why.map(function(w){return '<p style="margin:4px 0">'+esc(w)+'</p>'}).join('')+'</div>';
    if(x.markets){h+='<h2>Tous les marchés</h2><div class="card">'+x.markets.map(function(m){return '<div class="mk"><span>'+esc(m.label)+'</span><span class="conf">'+E.pct(m.p)+'</span></div>'}).join('')+'</div>'}
    if(x.ou)h+='<div class="mute">Total de points proposé par le marché : '+String(x.ou).replace('.',',')+'</div>';
    h+='<p class="mute">⭐ = joueur clé de l\'équipe. Les absences, compositions et cotes sont relues toutes les 5 minutes dans les 3 heures avant le match.</p>';
    sheetOpen(h);
  },
  calCard:function(){
    var C=(SP.cal||[]).filter(function(c){return SP.filter==='all'||c[2]===SP.filter});
    if(!C.length)return '<div class="card">La vérification de fiabilité apparaît dès que l\'historique des compétitions du jour est chargé.</div>';
    var B=[[0.5,0.6],[0.6,0.7],[0.7,0.8],[0.8,0.9],[0.9,1.01]],h='<h2>Fiabilité vérifiée (21 derniers jours)</h2><div class="card"><div class="mute" style="margin-bottom:6px">Le modèle a été recalculé sans les 21 derniers jours, puis confronté aux '+C.length+' résultats réels de cette période (sans les cotes).</div>';
    h+='<div class="mk"><b>Annoncé</b><b>Matchs</b><b>Prévu</b><b>Réel</b></div>';
    B.forEach(function(b){var c=C.filter(function(x){return x[0]>=b[0]&&x[0]<b[1]});if(!c.length)return;var pr=c.reduce(function(s,x){return s+x[0]},0)/c.length,re=c.reduce(function(s,x){return s+x[1]},0)/c.length;
      h+='<div class="mk"><span>'+Math.round(b[0]*100)+'–'+Math.min(100,Math.round(b[1]*100))+' %</span><span>'+c.length+'</span><span>'+E.pct(pr)+'</span><span class="'+(re>=pr-0.05?'ok':'ko')+'">'+E.pct(re)+'</span></div>'});
    var i=SP.info||{};
    return h+'<div class="mute" style="margin-top:6px">Uniquement des compétitions ouvertes aux paris en France (liste officielle ANJ). Notes de force calculées sur '+(i.games||0)+' matchs dans '+(i.leagues||0)+' compétitions.</div></div>';
  },
  bind:function(){document.querySelectorAll('.chips button').forEach(function(b){b.onclick=function(){SP.filter=b.dataset.f;render()}})}
};
try{if(localStorage.getItem('turf.mode')==='sport'){setTimeout(function(){var b=document.querySelector('.modes button[data-m=sport]');b&&b.click()},0)}}catch(e){}

if(/[?&]test=1/.test(location.search))window.__t={loadDay:loadDay,SP:SP,S:S};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
render();loadDay(true);
})();

</script>
</body>
