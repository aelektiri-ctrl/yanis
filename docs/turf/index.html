<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turf Analyste</title>
<meta name="theme-color" content="#140c33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#140c33;--bg2:#1e1150;--card:#22155a;--card2:#2b1b6e;--ink:#fff7ec;--mute:#b9addf;--line:rgba(255,255,255,.10);
--pink:#ff3d81;--orange:#ff9f1c;--yellow:#ffd93d;--teal:#2ee6c5;--violet:#9b6bff;--red:#ff4b4b;--green:#3ddc84;
--accent:#ff9f1c;--accent-ink:#1a0f3d;--sec:#2ee6c5;--fort:#ff9f1c;--doute:#9b6bff;--good:#3ddc84;--bad:#ff5e7a;--chip:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font:15px/1.45 "Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);background-image:radial-gradient(1200px 500px at 10% -10%,rgba(255,61,129,.28),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(46,230,197,.18),transparent 60%),radial-gradient(800px 600px at 50% 120%,rgba(155,107,255,.30),transparent 60%);background-attachment:fixed;min-height:100vh}
/* guirlande de lampions */
.lamps{position:relative;height:38px;margin:0 -16px;overflow:hidden;pointer-events:none}
.lamps:before{content:"";position:absolute;left:-5%;right:-5%;top:-22px;height:40px;border-bottom:2px solid rgba(255,255,255,.35);border-radius:0 0 50% 50%}
.lamps i{position:absolute;top:10px;width:16px;height:20px;border-radius:45% 45% 50% 50%;transform-origin:50% -8px;animation:swing 2.6s ease-in-out infinite alternate,glow 1.8s ease-in-out infinite alternate}
.lamps i:before{content:"";position:absolute;left:5px;top:-5px;width:6px;height:4px;background:#ffe9a8;border-radius:2px}
.lamps i:nth-child(5n+1){background:var(--pink);color:var(--pink)}.lamps i:nth-child(5n+2){background:var(--yellow);color:var(--yellow)}
.lamps i:nth-child(5n+3){background:var(--teal);color:var(--teal)}.lamps i:nth-child(5n+4){background:var(--orange);color:var(--orange)}.lamps i:nth-child(5n+5){background:var(--violet);color:var(--violet)}
@keyframes swing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes glow{from{box-shadow:0 0 6px 1px currentColor;filter:brightness(.9)}to{box-shadow:0 0 16px 5px currentColor;filter:brightness(1.25)}}
header{position:sticky;top:0;z-index:5;padding:env(safe-area-inset-top) 16px 0;background:linear-gradient(180deg,rgba(20,12,51,.97),rgba(20,12,51,.90));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;white-space:nowrap;margin:0;letter-spacing:-.3px;font-weight:900;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink),var(--violet),var(--teal),var(--yellow));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
h1 span{color:inherit}h1 small{-webkit-text-fill-color:var(--mute)}
@keyframes flow{to{background-position:300% 0}}
.datebar{display:flex;align-items:center;gap:4px}.datebar button{padding:6px 9px}
button{font:inherit;color:inherit;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:7px 11px;cursor:pointer}
button.primary{background:linear-gradient(90deg,var(--orange),var(--pink));color:#fff;font-weight:800;border:0;box-shadow:0 6px 18px rgba(255,61,129,.35)}
.status{font-size:12px;color:var(--mute);margin:6px 0 6px;display:flex;justify-content:space-between;gap:8px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--yellow),var(--pink));width:0;transition:width .3s}
.modes{display:flex;gap:8px;margin:6px 0 4px}.modes button{flex:1;font-weight:800;padding:10px;border-radius:14px}
.modes button.on{border:0;color:#fff;background:linear-gradient(120deg,var(--pink),var(--orange));box-shadow:0 6px 18px rgba(255,61,129,.35)}
.modes button[data-m=sport].on{background:linear-gradient(120deg,var(--teal),var(--violet));box-shadow:0 6px 18px rgba(46,230,197,.3)}
nav{display:flex;gap:4px}nav[hidden]{display:none}
nav button{flex:1;background:none;border:0;border-radius:0;border-bottom:3px solid transparent;color:var(--mute);padding:9px 4px;font-weight:700}
nav button.on{color:var(--yellow);border-color:var(--yellow)}
#bellN{display:inline-block;font-size:11px;margin-left:2px;color:var(--pink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}.chips button{white-space:nowrap;font-size:13px;padding:6px 12px;border-radius:20px}
.chips button.on{background:var(--yellow);color:var(--accent-ink);border-color:var(--yellow);font-weight:800}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 40px);max-width:760px;margin:0 auto}
.card{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-left:4px solid var(--violet);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card.sp-trot{border-left-color:var(--orange)}.card.sp-galop{border-left-color:var(--teal)}
.card.sp-foot{border-left-color:var(--green)}.card.sp-nba,.card.sp-wnba{border-left-color:var(--orange)}.card.sp-nfl{border-left-color:var(--pink)}.card.sp-nhl{border-left-color:#5ec8ff}.card.sp-mlb{border-left-color:var(--yellow)}.card.sp-tennis{border-left-color:#c6ff3d}.card.sp-mma{border-left-color:var(--red)}
.card.is-live{border-color:rgba(255,75,75,.6);box-shadow:0 0 0 1px rgba(255,75,75,.35),0 8px 28px rgba(255,75,75,.25)}
.card.hl{border-left-color:var(--yellow)}
.tap{cursor:pointer;transition:transform .12s}.tap:active{transform:scale(.985)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ttl{font-weight:800}.mute{color:var(--mute);font-size:13px}
.badge{font-size:11px;font-weight:900;letter-spacing:.5px;padding:3px 9px;border-radius:20px;color:var(--accent-ink);white-space:nowrap}
.LOUP{background:linear-gradient(90deg,#ff4b4b,#ff9f1c);color:#fff}.livesim{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:6px 10px;border-radius:10px;background:rgba(255,75,75,.14);font-size:13px}.livesim b{color:#fff;font-size:16px}.simbar{display:grid;grid-template-columns:48px 1fr 44px;align-items:center;gap:8px;font-size:13px;margin:3px 0}.simbar i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--yellow))}.simbar b{text-align:right;color:var(--yellow)}.rmini{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mute);margin-top:4px}.rmini b{color:var(--yellow)}.SEC{background:var(--sec)}.FORT{background:var(--fort)}.DOUTE{background:var(--doute);color:#fff}.NA{background:var(--mute)}
.big{font-size:18px;font-weight:900;margin:6px 0 2px}
.conf{font-variant-numeric:tabular-nums;font-weight:900;color:var(--yellow)}
.meter{height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--teal));background-size:200% 100%;animation:flow 4s linear infinite}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--yellow);margin:18px 0 8px}
.reu{margin-bottom:14px}.reu>.row{padding:4px 2px 8px}
.crow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.crow:first-of-type{border-top:0}
.crow .h{font-variant-numeric:tabular-nums;font-weight:800;width:46px;color:var(--teal)}.crow .m{flex:1;min-width:0}.crow .m>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--good);font-weight:800}.ko{color:var(--bad);font-weight:800}
#sheet{position:fixed;inset:0;background:var(--bg);background-image:inherit;z-index:20;overflow:auto;display:none;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 40px)}
#sheet.open{display:block;animation:up .22s ease-out}#sheet .in{max-width:760px;margin:0 auto}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.jeu{border-left:4px solid var(--teal);padding:9px 11px;margin:8px 0;background:rgba(255,255,255,.06);border-radius:10px}
.jeu.main{border-left-color:var(--yellow);background:rgba(255,217,61,.10)}
.horse{border-top:1px solid var(--line);padding:9px 0}.horse:first-child{border-top:0}
.hn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:var(--chip);font-weight:900;margin-right:8px;flex:none}
.hn.b{background:linear-gradient(135deg,var(--yellow),var(--orange));color:var(--accent-ink)}
.why{margin:6px 0 0 38px;padding:0;list-style:none;font-size:13px}.why li{margin:2px 0}.why .p{color:var(--good)}.why .n{color:var(--bad)}
.err{border-left-color:var(--bad)}
.foot{font-size:12px;color:var(--mute);text-align:center;margin-top:24px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpis div{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.kpis b{display:block;font-size:21px;color:var(--yellow)}
.mk{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}.mk:first-child{border-top:0}
.alert{border-left:4px solid var(--orange);padding:9px 11px;margin:8px 0;background:var(--card);border-radius:10px;font-size:14px}
.inj{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line);font-size:13px}.inj:first-child{border-top:0}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;background:var(--chip);margin:4px 3px 0}
/* direct */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.chip{font-size:11px;font-weight:900;padding:3px 9px;border-radius:20px;white-space:nowrap}
.chip.live{background:var(--red);color:#fff;animation:pulse 1.6s infinite}.chip.fin{background:var(--chip);color:var(--mute)}.chip.pre{background:rgba(46,230,197,.15);color:var(--teal)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,75,75,.6)}70%{box-shadow:0 0 0 8px rgba(255,75,75,0)}100%{box-shadow:0 0 0 0 rgba(255,75,75,0)}}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:10px 0 6px}
.board .tm{font-weight:800;font-size:15px;line-height:1.2}.board .tm.r{text-align:right}
.sc{font-size:24px;font-weight:900;color:var(--yellow);font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(255,217,61,.45);white-space:nowrap}
.vs{font-size:13px;color:var(--mute);font-weight:800}
.big2 .sc{font-size:34px}
.prono{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:10px;padding:7px 10px;font-size:14px}
.tv{font-size:12px;color:var(--mute);margin-top:6px}.tv a{color:var(--teal)}
.strip{display:inline-block;font-size:11px;font-weight:900;padding:2px 9px;border-radius:20px;margin:0 0 6px;background:var(--chip);color:var(--mute)}
.strip.live{background:var(--red);color:#fff;animation:pulse 1.6s infinite}.strip.soon{background:var(--orange);color:var(--accent-ink)}.strip.fin{background:rgba(61,220,132,.16);color:var(--good)}
.crow .strip{margin:4px 0 0}
.btn-eq{display:block;text-align:center;margin:10px 0 4px;padding:12px;border-radius:14px;font-weight:900;color:#fff;text-decoration:none;background:linear-gradient(90deg,#e4002b,#ff6a00);box-shadow:0 6px 18px rgba(228,0,43,.35)}
.money{text-align:center;border-left-color:var(--yellow)}.money.up .big{color:var(--good)}.money.down .big{color:var(--bad)}
a{color:var(--teal)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="lamps" aria-hidden="true"><i style="left:4%;animation-delay:0.0s,0.0s"></i><i style="left:12%;animation-delay:0.4s,0.5s"></i><i style="left:20%;animation-delay:0.8s,1.0s"></i><i style="left:28%;animation-delay:1.2s,0.0s"></i><i style="left:36%;animation-delay:0.0s,0.5s"></i><i style="left:44%;animation-delay:0.4s,1.0s"></i><i style="left:52%;animation-delay:0.8s,0.0s"></i><i style="left:60%;animation-delay:1.2s,0.5s"></i><i style="left:68%;animation-delay:0.0s,1.0s"></i><i style="left:76%;animation-delay:0.4s,0.0s"></i><i style="left:84%;animation-delay:0.8s,0.5s"></i><i style="left:92%;animation-delay:1.2s,1.0s"></i></div>
  <div class="top">
    <h1>Turf <span>Analyste</span> <small style="font-size:11px;font-weight:700">v9</small></h1>
    <div class="datebar"><button id="bell" aria-label="Alertes">🔔<b id="bellN"></b></button><button id="prev" aria-label="Jour précédent">‹</button><button id="today">Auj.</button><button id="next" aria-label="Jour suivant">›</button></div>
  </div>
  <div class="status"><span id="st">Prêt</span><span id="upd"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="modes"><button data-m="turf" class="on">🏇 Turf</button><button data-m="sport">⚽ Sport</button></div>
  <nav id="navTurf"><button data-t="sel" class="on">Sélections</button><button data-t="prog">Programme</button><button data-t="bilan">Bilan</button></nav>
  <nav id="navSport" hidden><button data-t="top" class="on">Top 70 %</button><button data-t="list">Matchs</button><button data-t="sbilan">Bilan</button></nav>
</header>
<main id="view"></main>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<script>
/* Turf Analyste — moteur d'analyse hippique
   Entrées : une course du programme PMU + sa liste de participants.
   Sorties : probabilités par cheval, simulations d'arrivée, niveau de confiance,
   jeux proposés (sec / champ réduit / 2 sur 4) et explications. */
(function (root) {
  'use strict';

  var SPEC_LETTER = { TROT_ATTELE: 'a', TROT_MONTE: 'm', PLAT: 'p', HAIE: 'h', STEEPLECHASE: 's', CROSS: 'c' };
  var POS_PTS = { '1': 10, '2': 8, '3': 6.5, '4': 5, '5': 4, '6': 3, '7': 2, '8': 1.5, '9': 1, '0': 0.5, 'D': 0, 'A': 0, 'T': 0, 'R': 0.5, 'N': 0.5 };

  // ---------- utilitaires ----------
  function num(v) { var n = +v; return isFinite(n) ? n : null; }
  function mean(a) { var s = 0, n = 0; a.forEach(function (x) { if (x != null) { s += x; n++; } }); return n ? s / n : null; }
  function sd(a, m) { var s = 0, n = 0; a.forEach(function (x) { if (x != null) { s += (x - m) * (x - m); n++; } }); return n > 1 ? Math.sqrt(s / (n - 1)) : 0; }
  function zscores(a) {
    var m = mean(a); if (m == null) return a.map(function () { return 0; });
    var s = sd(a, m) || 1;
    return a.map(function (x) { return x == null ? 0 : Math.max(-2.5, Math.min(2.5, (x - m) / s)); });
  }
  function normalize(a) { var s = a.reduce(function (x, y) { return x + y; }, 0) || 1; return a.map(function (x) { return x / s; }); }
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function comb(n, k) { if (k < 0 || k > n) return 0; var r = 1; for (var i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }
  function pct(x) { return Math.round(x * 100) + ' %'; }
  function fmtCote(c) { return c == null ? '—' : (c < 10 ? c.toFixed(1) : Math.round(c)).toString().replace('.', ','); }

  // ---------- musique ----------
  function parseMusique(m) {
    var out = []; if (!m) return out;
    var re = /\((\d{2})\)|([0-9DATRN])([a-z])/g, x, year = 0;
    while ((x = re.exec(m))) { if (x[1]) { year++; continue; } out.push({ pos: x[2], disc: x[3], old: year > 0 }); }
    return out;
  }
  function formFromMusique(tokens, disc) {
    var w = [1, 0.85, 0.72, 0.6, 0.5, 0.42], s = 0, ws = 0, sd2 = 0, wsd = 0, faults = 0;
    tokens.slice(0, 6).forEach(function (t, i) {
      var p = POS_PTS[t.pos] != null ? POS_PTS[t.pos] : 1, wi = w[i] * (t.old ? 0.8 : 1);
      s += p * wi; ws += wi; if (t.disc === disc) { sd2 += p * wi; wsd += wi; }
    });
    tokens.slice(0, 5).forEach(function (t) { if ('DAT'.indexOf(t.pos) >= 0) faults++; });
    return { form: ws ? s / ws : null, formDisc: wsd ? sd2 / wsd : null, faults: faults, recent: tokens.slice(0, 5).map(function (t) { return t.pos; }) };
  }

  // ---------- caractéristiques d'un partant ----------
  function isTrot(course) { return /TROT/.test(course.specialite || '') || /TROT/.test(course.discipline || ''); }
  function isPlat(course) { return (course.specialite || '') === 'PLAT'; }

  function extract(p, course) {
    var disc = SPEC_LETTER[course.specialite] || '';
    var mus = parseMusique(p.musique || '');
    var f = formFromMusique(mus, disc);
    var nc = num(p.nombreCourses) || 0, nv = num(p.nombreVictoires) || 0, npl = num(p.nombrePlaces) || 0;
    var g = p.gainsParticipant || {};
    var gainsCar = (num(g.gainsCarriere) || 0) / 100, gainsAn = (num(g.gainsAnneeEnCours) || 0) / 100;
    var rd = p.dernierRapportDirect || {}, rr = p.dernierRapportReference || {};
    var cote = num(rd.rapport), coteRef = num(rr.rapport);
    var poids = num(p.handicapPoids) || num(p.poidsConditionMonte);
    if (poids != null && poids > 200) poids = poids / 10; // hectogrammes -> kg
    var recul = null;
    if (isTrot(course) && num(p.handicapDistance) && num(course.distance)) recul = num(p.handicapDistance) - num(course.distance);
    return {
      num: num(p.numPmu), nom: p.nom || ('N°' + p.numPmu), age: num(p.age), sexe: p.sexe,
      driver: (p.driver || p.jockey || ''), entraineur: p.entraineur || '', driverChange: !!p.driverChange,
      musique: p.musique || '', mus: mus, f: f, nc: nc, nv: nv, npl: npl,
      inedit: !!p.indicateurInedit || nc === 0,
      gainsCar: gainsCar, gainsAn: gainsAn, gps: nc ? gainsCar / nc : null,
      cote: cote, coteRef: coteRef, favori: !!rd.favoris,
      deferre: p.deferre || '', avis: p.avisEntraineur || '', oeil: p.oeilleres || '',
      corde: num(p.placeCorde), poids: poids, recul: recul,
      arrivee: num(p.ordreArrivee),
      py: num(p.proba), pyMarche: num(p.proba_marche), stD: p.st_driver || null, stT: p.st_entraineur || null,
      suivi: p.cotes_suivies || null, incident: p.incident || '', pere: p.pere || '', valueY: !!p.value
    };
  }

  // ---------- performances détaillées ----------
  function fmtRK(rk) { var m = Math.floor(rk / 60000), sec = (rk % 60000) / 1000; return m + "'" + sec.toFixed(1).replace('.', '"'); }
  function attachPerf(H, pj, course) {
    var list = pj && (pj.participants || pj); if (!Array.isArray(list)) return 0;
    var byNum = {}; list.forEach(function (x) { byNum[num(x.numPmu)] = x; });
    var trot = isTrot(course), now = course.heureDepart || Date.now();
    var hipp = (course.hippodromeNom || '').toUpperCase(), got = 0;
    H.forEach(function (h) {
      var x = byNum[h.num]; if (!x) return;
      var cc = x.coursesCourues || x.courses || []; if (!cc.length) return;
      var P = { n: 0, hippOk: 0, distOk: 0 }, rks = [], allocs = [];
      cc.slice(0, 8).forEach(function (r, i) {
        var me = (r.participants || []).filter(function (q) { return q.itsHim; })[0]; if (!me) return;
        P.n++;
        var dt = num(r.date); if (P.days == null && dt) P.days = Math.round((now - dt) / 864e5);
        var al = num(r.allocation); if (al && allocs.length < 4) allocs.push(al);
        var dist = num(me.distanceParcourue) || num(r.distance);
        var rk = num(me.reductionKilometrique);

  S.prog.reunions.forEach(function(r){r.courses.forEach(function(c){out.push({r:r,c:c,a:S.an[key(r.numOfficiel,c.numOrdre)]})})});
  return out;
}
function badge(a){if(!a||!a.ok)return '<span class="badge NA">EN ATTENTE</span>';return (a.loup?'<span class="badge LOUP">🐺 LOUP</span> ':'')+'<span class="badge '+a.level+'">'+LVL[a.level]+'</span>'}
function resultTag(a){if(!a||!a.arrivee||!a.main)return '';return a.main.gagne?' <span class="ok">✓ gagnant</span>':' <span class="ko">✗ perdu</span>'}

function tState(c,a){
  var now=Date.now(),st=c.statut||'';
  if(a&&a.arrivee)return {cls:'fin',txt:'🏁 Arrivée : '+a.arrivee.slice(0,5).join(' - ')};
  if(/ANNUL/.test(st))return {cls:'fin',txt:'Course annulée'};
  if(/EN_COURS|COURSE_PARTIE|FIN_COURSE/.test(st)||(c.heureDepart&&now>=c.heureDepart&&now<c.heureDepart+20*60000))return {cls:'live',txt:'EN COURSE'};
  if(c.heureDepart&&now<c.heureDepart){var m=Math.round((c.heureDepart-now)/60000);return {cls:m<=15?'soon':'pre',txt:m<=60?'Départ dans '+m+' min':'Départ '+hhmm(c.heureDepart)}}
  return {cls:'pre',txt:'Résultat en attente'};
}
function liveStrip(c,a){var t=tState(c,a);return '<div class="strip '+t.cls+'">'+(t.cls==='live'?'<i class="dot"></i>':'')+esc(t.txt)+'</div>'}

  rs.forEach(function(r){var nm=RNAME[r.pari]||r.libelle||r.pari,lb=r.libelle&&!new RegExp('^'+nm.split(' ')[0],'i').test(r.libelle)?' · '+r.libelle:(r.pari==='MULTI'||r.pari==='QUINTE_PLUS'?' · '+r.libelle:'');
    h+='<div class="mk"><span>'+esc(nm+lb)+' <span class="mute">'+esc(String(r.combinaison))+'</span></span><span class="conf">'+String(r.rapport).replace('.',',')+' €</span></div>'});
  return h+'</div>';
}
function rapportsMini(c){var R=c.rapports||[];if(!R.length)return '';var pick=function(t,re){var x=R.filter(function(r){return r.pari===t&&(!re||re.test(r.libelle||''))})[0];return x?x.rapport:null};
  var o=[['SG',pick('SIMPLE_GAGNANT')],['Jum.G',pick('COUPLE_GAGNANT')],['Trio',pick('TRIO')],['Multi4',pick('MULTI',/en 4/i)],['2/4',pick('DEUX_SUR_QUATRE')]].filter(function(x){return x[1]!=null});
  return o.length?'<div class="rmini">'+o.map(function(x){return '<span>'+x[0]+' <b>'+String(x[1]).replace('.',',')+' €</b></span>'}).join('')+'</div>':''}

function viewBilan(){
  if(!S.prog)return intro();
  var lc=learnCard(true);
  var fin=allCourses().filter(function(x){return x.a&&x.a.ok&&x.a.arrivee&&x.a.main});
  if(!fin.length)return lc+'<div class="card">Aucune arrivée connue pour le moment. Le bilan se remplit automatiquement au fil des courses.</div>';
  var win=0,mise=0,ret=0,nR=0,byL={SEC:[0,0,0,0],FORT:[0,0,0,0],DOUTE:[0,0,0,0]};
  fin.forEach(function(x){var m=x.a.main,g=m.gagne;if(g)win++;mise+=m.cout;var L=byL[x.a.level];L[0]+=g?1:0;L[1]++;if(m.rapportOk){nR++;ret+=m.retour;L[2]+=m.cout;L[3]+=m.retour}});
  var exp=fin.reduce(function(s,x){return s+x.a.conf},0);
  var h=lc+'<div class="kpis"><div><b>'+win+'/'+fin.length+'</b><span class="mute">jeux gagnants</span></div><div><b>'+E.pct(win/fin.length)+'</b><span class="mute">réussite réelle</span></div><div><b>'+E.pct(exp/fin.length)+'</b><span class="mute">réussite prévue</span></div></div>';
  h+='<h2>Par niveau</h2><div class="card">';
  ['SEC','FORT','DOUTE'].forEach(function(l){var v=byL[l];h+='<div class="row" style="padding:4px 0"><span class="badge '+l+'">'+LVL[l]+'</span><span>'+v[0]+' / '+v[1]+(v[2]?' · <span class="'+(v[3]>=v[2]?'ok':'ko')+'">'+(v[3]-v[2]>=0?'+':'')+euros(v[3]-v[2])+'</span>':'')+'</span></div>'});
  h+='</div>';
  if(nR){var net=ret-mise;h+='<div class="card money '+(net>=0?'up':'down')+'"><div class="mute">Bilan réel avec les rapports PMU (1 € par combinaison, jeux principaux)</div><div class="big">'+(net>=0?'+':'')+euros(net)+'</div><div class="mute">Mis : '+euros(mise)+' · Rapporté : '+euros(ret)+'</div></div>'}
  h+='<p class="mute">Si la réussite réelle reste proche de la réussite prévue sur plusieurs semaines, le modèle est bien calibré.</p><h2>Courses terminées</h2>';

      '<div class="mute" style="margin-left:36px">Gagne '+E.pct(hh.top[0])+' · Top 3 '+E.pct(hh.top[2])+' · Top 4 '+E.pct(hh.top[3])+'</div>'+
      (rs.length?'<ul class="why">'+rs.map(function(x){return '<li class="'+(x.sign>0?'p':x.sign<0?'n':'')+'">'+(x.sign>0?'▲ ':x.sign<0?'▼ ':'• ')+esc(x.txt)+'</li>'}).join('')+'</ul>':'')+'</div>';

  sheetOpen(h);

var ESPN_LOCAL=(new URLSearchParams(location.search).get('espn'))||'/espn/';
var ESPN=(new URLSearchParams(location.search).get('espnfull'))||'https://site.api.espn.com/apis/';
async function getESPN(path){
  var urls=YANIS?[ESPN+path]:[ESPN_LOCAL+path,ESPN+path],last;
  for(var i=0;i<urls.length;i++){
    try{var r=await Promise.race([fetch(urls[i],{cache:'no-store'}),timeout(15000)]);if(!r.ok)throw new Error('HTTP '+r.status);var ct=r.headers.get('content-type')||'';if(ct.indexOf('json')<0&&i===0)throw new Error('réponse non JSON');return await r.json()}
    catch(e){last=new Error((i?'ESPN direct':'serveur Netlify')+' : '+e.message)}
  }
  throw last;
}

      var res=await SportEngine.loadAll(getESPN,ymd,function(x){if(S.mode==='sport')setProg(x);SP.setSt('Matchs et historiques de saison… '+Math.round(x*100)+' %')},function(k,j){SP.diag[k]=j?(j.events||[]).length+' évts':'vide'},ST);
      SP.cal=res.cal;SP.info=res.info;
      if(!res.items.length&&res.errors.length===res.jobs)throw new Error(res.errors[0]||'aucune donnée');
      var old={};(SP.data||[]).forEach(function(x){if(x.main)old[x.id]={l:x.main.label,c:x.conf,inj:x.enr&&x.enr.abs?x.enr.abs[0].out+x.enr.abs[1].out:null,lu:!!(x.enr&&x.enr.lineups)}});
      SP.setSt('Blessures, compos et cotes de dernière minute…');
      var nE=await SportEngine.enrich(getESPN,res.items,SP.cache,function(x){if(S.mode==='sport')setProg(x)});
      SP.data=res.items;SP.last=new Date();
      res.items.forEach(function(x){if(x.liveP!=null){var h=SP.hist[hk(x)]||(SP.hist[hk(x)]=[]);if(!h.length||h[h.length-1]!==x.liveP)h.push(x.liveP);if(h.length>120)h.shift()}});
      res.items.forEach(function(x){
        var o=old[x.id];if(!o||x.state.done||!x.main)return;
        var lbl=x.title+' · ';
        if(o.l!==x.main.label&&(x.conf>=0.62||o.c>=0.62))pushAlert('sport',x.id,lbl+'Pronostic modifié : '+x.main.label+' ('+E.pct(x.conf)+')');
        else if(Math.abs(o.c-x.conf)>=0.05)pushAlert('sport',x.id,lbl+x.main.label+' passe de '+E.pct(o.c)+' à '+E.pct(x.conf));
        if(!o.lu&&x.enr&&x.enr.lineups)pushAlert('sport',x.id,lbl+'Compositions officielles publiées.');
        var inj=x.enr&&x.enr.abs?x.enr.abs[0].out+x.enr.abs[1].out:null;
        if(o.inj!=null&&inj!=null&&inj>o.inj)pushAlert('sport',x.id,lbl+'Nouvelle absence signalée.');
      });
      SP.setSt(res.items.length+' matchs analysés · '+res.info.games+' matchs d\'historique');
    }catch(e){SP.err=e.message;SP.setSt('Erreur : '+e.message)}
    setProg(0);SP.loading=false;if(S.mode==='sport'){render();$('upd').textContent=SP.last?'MAJ '+SP.last.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}
  },
  items:function(){return (SP.data||[]).filter(function(x){return SP.filter==='all'||x.sport===SP.filter})},
  chips:function(){
    var have={};(SP.data||[]).forEach(function(x){have[x.sport]=(have[x.sport]||0)+1});
    return '<div class="chips">'+['all','foot','rugby','nba','wnba','nfl','nhl','mlb','tennis','mma'].filter(function(k){return k==='all'||have[k]}).map(function(k){return '<button data-f="'+k+'" class="'+(SP.filter===k?'on':'')+'">'+(ICON[k]||'')+' '+SNAME[k]+(k!=='all'?' '+have[k]:'')+'</button>'}).join('')+'</div>';
  },
  card:function(x,i){
    var t=new Date(x.date),hh=isNaN(t)?'':t.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    var day=isNaN(t)?'':(t.toDateString()!==new Date().toDateString()?t.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})+' ':'');
    var tags='';if(x.enr){var ab=x.enr.abs?x.enr.abs[0].out+x.enr.abs[1].out:0;if(ab)tags+='<span class="tag">🩹 '+ab+' absent'+(ab>1?'s':'')+'</span>';if(x.enr.lineups)tags+='<span class="tag">📋 compos</span>';}
    var st=x.state.state,isLive=st==='in',done=x.state.done;
    var chip=isLive?'<span class="chip live"><i class="dot"></i>EN DIRECT'+(x.state.txt?' · '+esc(x.state.txt):'')+'</span>':done?'<span class="chip fin">Terminé</span>':'<span class="chip pre">'+day+hh+'</span>';
    var sc=x.live||x.score, mid;
    if(x.sport==='tennis')mid=x.setTxt?'<b class="sc">'+esc(x.setTxt)+'</b>':'<b class="vs">vs</b>';
    else if(x.sport==='mma')mid='<b class="vs">vs</b>';
    else mid=sc&&sc[0]!=null?'<b class="sc">'+sc[0]+' - '+sc[1]+'</b>':'<b class="vs">vs</b>';
    var trend='';
    if(isLive&&sc&&sc[0]!=null){var ok=null;if(x.main.ok)ok=x.main.ok(sc[0],sc[1]);else if(x.favHome!=null)ok=x.favHome?sc[0]>sc[1]:sc[1]>sc[0];if(ok!=null)trend=ok?' <span class="ok">· en bonne voie</span>':' <span class="ko">· menacé</span>'}
    var res=x.won===true?' <span class="ok">✓ gagné</span>':x.won===false?' <span class="ko">✗ perdu</span>':trend;
    var tv=x.tv&&x.tv.length?'<div class="tv">📺 '+esc(x.tv.join(' · '))+'</div>':'';
    if(isLive&&x.liveP!=null){var hs=SP.hist[hk(x)]||[],prev=hs.length>1?hs[hs.length-2]:null,arrow=prev==null?'':x.liveP>prev+0.01?' ▲':x.liveP<prev-0.01?' ▼':'';tv='<div class="livesim"><span>📡 Simulation en direct · '+SP.nsim(x)+'</span><b>'+E.pct(x.liveP)+arrow+'</b></div>'+tv}
    return '<div class="card tap sp-'+x.sport+(isLive?' is-live':'')+'" data-s="'+i+'"><div class="row"><span class="mute">'+(ICON[x.sport]||'')+' '+esc(x.league)+'</span>'+chip+'</div>'+
      '<div class="board"><span class="tm">'+esc(x.home)+'</span>'+mid+'<span class="tm r">'+esc(x.away)+'</span></div>'+(tags?'<div style="text-align:center">'+tags+'</div>':'')+
      '<div class="prono"><span>🎯 '+esc(x.main.label)+res+'</span><span class="row" style="gap:6px"><span class="badge '+x.level+'">'+SLVL[x.level]+'</span><span class="conf">'+E.pct(x.conf)+'</span></span></div><div class="meter"><i style="width:'+Math.round(x.conf*100)+'%"></i></div>'+tv+'</div>';
  },
  view:function(){
    if(SP.err&&!SP.data)return '<div class="card err"><div class="ttl">Connexion aux données sport impossible</div><p>'+esc(SP.err)+'</p><button class="primary" id="retry">Réessayer</button></div>';
    if(!SP.data)return '<div class="card">Chargement des matchs du jour…</div>';
    var all=SP.items(),h=SP.chips();
    if(SP.tab==='top'){
      var lv=all.filter(function(x){return x.state.state==='in'});
      if(lv.length){h+='<h2>🔴 En direct ('+lv.length+')</h2>';lv.forEach(function(x){h+=SP.card(x,SP.data.indexOf(x))})}
      var up=all.filter(function(x){return !x.state.done&&x.state.state!=='in'}).sort(function(a,b){return b.conf-a.conf});
      var top=up.filter(function(x){return x.conf>=0.70}),rest=up.filter(function(x){return x.conf<0.70});
      h+='<h2>'+top.length+' pronostic'+(top.length>1?'s':'')+' à 70 % et plus</h2>';
      if(!top.length)h+='<div class="card">Aucun match à venir ne dépasse 70 % pour ce filtre.</div>';
      top.forEach(function(x){h+=SP.card(x,SP.data.indexOf(x))});
      if(rest.length){h+='<h2>Tous les autres pronostics ('+rest.length+')</h2>';rest.forEach(function(x){h+=SP.card(x,SP.data.indexOf(x))})}
      return h+'<p class="mute">Le pourcentage est la probabilité estimée du pronostic. Un 75 % perd encore une fois sur quatre : vérifie la cote proposée avant de jouer.</p>';
    }
    if(SP.tab==='list'){
      if(!all.length)return h+'<div class="card">Aucun match pour ce filtre aujourd\'hui.</div>';
      var g={};all.forEach(function(x){(g[x.league]=g[x.league]||[]).push(x)});
      Object.keys(g).forEach(function(k){h+='<h2>'+(ICON[g[k][0].sport]||'')+' '+esc(k)+'</h2>';g[k].forEach(function(x){h+=SP.card(x,SP.data.indexOf(x))})});
      return h;
    }
    h+=SP.calCard();
    var fin=all.filter(function(x){return x.won===true||x.won===false});
    if(!fin.length)return h+'<div class="card">Aucun résultat connu pour le moment pour cette date. Le bilan du jour se remplit au fil des matchs.</div>';
    var w=fin.filter(function(x){return x.won}).length,exp=fin.reduce(function(s,x){return s+x.conf},0)/fin.length;
    var f70=fin.filter(function(x){return x.conf>=0.7}),w70=f70.filter(function(x){return x.won}).length;
    h+='<div class="kpis"><div><b>'+w+'/'+fin.length+'</b><span class="mute">pronostics gagnants</span></div><div><b>'+E.pct(w/fin.length)+'</b><span class="mute">réussite réelle</span></div><div><b>'+E.pct(exp)+'</b><span class="mute">réussite prévue</span></div></div>';
    if(f70.length)h+='<div class="card" style="margin-top:10px">Pronostics à 70 % et plus : <b>'+w70+' / '+f70.length+'</b> gagnants.</div>';
    h+='<h2>Matchs terminés</h2>';fin.forEach(function(x){h+=SP.card(x,SP.data.indexOf(x))});
    return h;
  },
  sheet:function(i){
    var x=SP.data[+i];if(!x)return;
    var t=new Date(x.date);
    var h='<div class="row" style="margin-bottom:8px"><button id="close">‹ Retour</button><span class="badge '+x.level+'">'+SLVL[x.level]+'</span></div>';
    h+='<div class="ttl" style="font-size:18px">'+(ICON[x.sport]||'')+' '+esc(x.title)+'</div><div class="mute">'+esc(x.league)+' · '+(isNaN(t)?'':t.toLocaleString('fr-FR',{weekday:'short',hour:'2-digit',minute:'2-digit'}))+(x.state.txt?' · '+esc(x.state.txt):'')+'</div>';
    var sc=x.live||x.score;if(sc&&sc[0]!=null&&x.sport!=='tennis'&&x.sport!=='mma')h+='<div class="card board big2" style="margin-top:10px"><span class="tm">'+esc(x.home)+'</span><b class="sc">'+sc[0]+' - '+sc[1]+'</b><span class="tm r">'+esc(x.away)+'</span></div><div class="mute" style="text-align:center">'+(x.state.state==='in'?'🔴 En direct '+esc(x.state.txt||''):x.state.done?'Score final':'')+'</div>';
    if(x.setTxt)h+='<div class="card" style="margin-top:10px;text-align:center"><b class="sc">'+esc(x.setTxt)+'</b></div>';
    h+='<div class="tv" style="margin-top:8px">'+(x.tv&&x.tv.length?'📺 Diffusion annoncée : '+esc(x.tv.join(', '))+' · ':'')+'<a href="https://www.google.com/search?q='+encodeURIComponent(x.home+' '+x.away+' diffusion tv chaîne')+'" target="_blank" rel="noopener">Où regarder ce match ?</a></div>';
    h+='<h2>Pronostic principal</h2><div class="jeu main"><div class="row"><span class="ttl">★ '+esc(x.main.label)+'</span><span class="conf">'+E.pct(x.main.p)+'</span></div>'+(x.main.dec?'<div class="mute">Cote '+x.main.dec.toFixed(2).replace('.',',')+' · espérance '+(x.main.p*x.main.dec).toFixed(2).replace('.',',')+' € par euro</div>':'')+(x.won===true?'<div class="ok">✓ gagnant</div>':x.won===false?'<div class="ko">✗ perdu</div>':'')+'</div>';
    if(x.safe&&x.safe.p>=0.7)h+='<div class="jeu"><div class="row"><span class="ttl">Option la plus sûre : '+esc(x.safe.label)+'</span><span class="conf">'+E.pct(x.safe.p)+'</span></div></div>';
    if(x.value)h+='<div class="jeu"><div class="row"><span class="ttl">Pari value : '+esc(x.value.label)+'</span><span class="conf">'+E.pct(x.value.p)+'</span></div><div class="mute">Cote '+x.value.dec.toFixed(2).replace('.',',')+' : le marché sous-estime cette issue.</div></div>';
    if(x.enr){
      var en=x.enr,names=[x.home,x.away];
      h+='<h2>Dernière minute <span class="mute" style="text-transform:none;letter-spacing:0">· MAJ '+new Date(en.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</span></h2><div class="card">';
      if(en.abs){[0,1].forEach(function(k){var t=en.abs[k];h+='<div class="ttl" style="margin-top:'+(k?'10':'0')+'px">'+esc(names[k])+' : '+(t.list.length?t.list.length+' joueur(s) signalé(s)':'aucune absence signalée')+'</div>';t.list.slice(0,10).forEach(function(p){h+='<div class="inj"><span>'+(p.key?'⭐ ':'')+esc(p.name)+(p.pos?' <span class="mute">'+esc(p.pos)+'</span>':'')+'</span><span class="mute">'+esc(p.status)+(p.detail?' · '+esc(p.detail):'')+'</span></div>'})})}
      else h+='<div class="mute">Pas de rapport de blessures publié pour ce match.</div>';
      if(en.lineups){h+='<div class="ttl" style="margin-top:10px">Compositions officielles</div>';[0,1].forEach(function(k){h+='<div class="mute" style="margin-top:4px"><b>'+esc(names[k])+'</b>'+(en.lineups[k].formation?' ('+esc(en.lineups[k].formation)+')':'')+' : '+esc(en.lineups[k].starters.join(', '))+'</div>'})}
      else if(x.sport==='foot')h+='<div class="mute" style="margin-top:8px">Compositions pas encore publiées (en général 1 h avant le coup d\'envoi).</div>';
      if(en.bpi!=null)h+='<div class="mute" style="margin-top:8px">Prédicteur ESPN : '+esc(x.home)+' '+E.pct(en.bpi)+'</div>';
      if(en.form5)h+='<div class="mute">Forme 5 derniers matchs : '+esc(x.home)+' '+esc(en.form5[0]||'—')+' · '+esc(x.away)+' '+esc(en.form5[1]||'—')+'</div>';
      h+='</div>';
    }
    if(x.sim){var S2=x.sim,lv=x.state.state==='in';
      h+='<h2>'+(lv?'📡 Simulation en direct':'🎲 Simulation avant-match')+' ('+S2.n.toLocaleString('fr-FR')+' '+(x.sport==='tennis'?'matchs':x.sport==='foot'?'matchs':'matchs')+')</h2><div class="card">';
      if(lv&&S2.r!=null)h+='<div class="mute">Le reste du match ('+Math.round(S2.r*100)+' % du temps de jeu) est rejoué '+S2.n.toLocaleString('fr-FR')+' fois à partir du score actuel.</div>';
      if(lv&&x.sport==='tennis')h+='<div class="mute">Les sets restants sont rejoués '+S2.n.toLocaleString('fr-FR')+' fois à partir des sets déjà gagnés.</div>';
      h+='<div class="mk"><span>'+esc(x.main.label)+'</span><span class="conf">'+E.pct(S2.main)+'</span></div>';
      if(x.sport==='foot')h+='<div class="mk"><span>'+esc(x.home)+' / Nul / '+esc(x.away)+'</span><span>'+E.pct(S2.p[0])+' · '+E.pct(S2.p[1])+' · '+E.pct(S2.p[2])+'</span></div>';
      else h+='<div class="mk"><span>Victoire '+esc(x.home)+' / '+esc(x.away)+'</span><span>'+E.pct(S2.p[0])+' · '+E.pct(S2.p[2])+'</span></div>';
      if(S2.top&&S2.top.length){h+='<div class="mute" style="margin-top:6px">'+(S2.margin?'Écarts finaux les plus fréquents ('+esc(x.home)+')':'Scores finaux les plus fréquents')+' :</div>';S2.top.forEach(function(t){var lab=S2.margin?((+t[0]>0?'+':'')+t[0]):t[0];h+='<div class="simbar"><span>'+esc(lab)+'</span><i style="width:'+Math.round(t[1]/S2.top[0][1]*100)+'%"></i><b>'+E.pct(t[1])+'</b></div>'})}
      var hs=SP.hist[hk(x)];if(lv&&hs&&hs.length>1)h+='<div class="mute" style="margin-top:6px">Évolution en direct : '+hs.slice(-12).map(function(v){return Math.round(v*100)}).join(' → ')+' %</div>';
      h+='</div>';
    }
    h+='<h2>Pourquoi</h2><div class="card">'+x.why.map(function(w){return '<p style="margin:4px 0">'+esc(w)+'</p>'}).join('')+'</div>';
    if(x.markets){h+='<h2>Tous les marchés</h2><div class="card">'+x.markets.map(function(m){return '<div class="mk"><span>'+esc(m.label)+'</span><span class="conf">'+E.pct(m.p)+'</span></div>'}).join('')+'</div>'}
    if(x.ou)h+='<div class="mute">Total de points proposé par le marché : '+String(x.ou).replace('.',',')+'</div>';
    h+='<p class="mute">⭐ = joueur clé de l\'équipe. Les absences, compositions et cotes sont relues toutes les 5 minutes dans les 3 heures avant le match.</p>';
    sheetOpen(h);
  },
  calCard:function(){
    var C=(SP.cal||[]).filter(function(c){return SP.filter==='all'||c[2]===SP.filter});
    if(!C.length)return '<div class="card">La vérification de fiabilité apparaît dès que l\'historique des compétitions du jour est chargé.</div>';
    var B=[[0.5,0.6],[0.6,0.7],[0.7,0.8],[0.8,0.9],[0.9,1.01]],h='<h2>Fiabilité vérifiée (21 derniers jours)</h2><div class="card"><div class="mute" style="margin-bottom:6px">Le modèle a été recalculé sans les 21 derniers jours, puis confronté aux '+C.length+' résultats réels de cette période (sans les cotes).</div>';
    h+='<div class="mk"><b>Annoncé</b><b>Matchs</b><b>Prévu</b><b>Réel</b></div>';
    B.forEach(function(b){var c=C.filter(function(x){return x[0]>=b[0]&&x[0]<b[1]});if(!c.length)return;var pr=c.reduce(function(s,x){return s+x[0]},0)/c.length,re=c.reduce(function(s,x){return s+x[1]},0)/c.length;
      h+='<div class="mk"><span>'+Math.round(b[0]*100)+'–'+Math.min(100,Math.round(b[1]*100))+' %</span><span>'+c.length+'</span><span>'+E.pct(pr)+'</span><span class="'+(re>=pr-0.05?'ok':'ko')+'">'+E.pct(re)+'</span></div>'});
    var i=SP.info||{};
    return h+'<div class="mute" style="margin-top:6px">Uniquement des compétitions ouvertes aux paris en France (liste officielle ANJ). Notes de force calculées sur '+(i.games||0)+' matchs dans '+(i.leagues||0)+' compétitions.</div></div>';
  },
  bind:function(){document.querySelectorAll('.chips button').forEach(function(b){b.onclick=function(){SP.filter=b.dataset.f;render()}})}
};
try{if(localStorage.getItem('turf.mode')==='sport'){setTimeout(function(){var b=document.querySelector('.modes button[data-m=sport]');b&&b.click()},0)}}catch(e){}

if(/[?&]test=1/.test(location.search))window.__t={loadDay:loadDay,SP:SP,S:S};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
render();loadDay(true);
})();
