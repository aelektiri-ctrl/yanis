<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1512">
<title>Yanis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
:root{
  --fond:#0e1512; --carte:#16201b; --carte2:#1d2a24; --ligne:#2a3a32;
  --texte:#eef3ef; --doux:#9fb2a7; --vert:#3ddc84; --or:#f2c14e; --rouge:#ff6b6b; --bleu:#6ab7ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--texte);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(14,21,18,.95);backdrop-filter:blur(8px);padding:14px 16px 10px;border-bottom:1px solid var(--ligne)}
header h1{margin:0;font-size:22px;letter-spacing:.5px}
header h1 span{color:var(--vert)}
#maj{color:var(--doux);font-size:12px}
main{padding:12px 16px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b110e;border-top:1px solid var(--ligne);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--doux);padding:10px 0 12px;font:inherit;font-size:11.5px}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.actif{color:var(--vert)}
.bandeau{background:#2b2410;border:1px solid #5a4a1a;color:#f6dd97;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.puces{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.puce{flex:none;background:var(--carte);border:1px solid var(--ligne);color:var(--texte);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px}
.puce.actif{background:var(--vert);color:#06210f;border-color:var(--vert);font-weight:600}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:12px;margin-bottom:10px}
.course{display:flex;gap:12px;align-items:center}
.heure{font-weight:700;font-size:17px;min-width:52px}
.course .info{flex:1;min-width:0}
.course .titre{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sous{color:var(--doux);font-size:12.5px}
.top{font-size:12.5px;margin-top:3px}
.top b{color:var(--vert)}
.fleche{color:var(--doux);font-size:20px}
h2{font-size:17px;margin:18px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.vide{color:var(--doux);text-align:center;padding:40px 10px}
.partant{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--ligne)}
.partant:first-of-type{border-top:0}
.rang{grid-row:span 2;align-self:center;width:30px;height:30px;border-radius:9px;background:var(--carte2);display:grid;place-items:center;font-weight:700;font-size:13px}
.rang.r1{background:var(--vert);color:#06210f}.rang.r2,.rang.r3{background:#244d36;color:var(--vert)}
.nomc{font-weight:600}
.nomc small{color:var(--doux);font-weight:400}
.droite{text-align:right;grid-row:span 2;align-self:center}
.cote{font-weight:700;font-size:16px}
.pct{font-size:12px;color:var(--doux)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:4px;vertical-align:1px}
.b-value{background:var(--or);color:#2a1d00}
.b-np{background:#3a2020;color:#ff9b9b}
.b-ok{background:#1d4d33;color:var(--vert)}
.b-ko{background:#3a2a2a;color:#ffb0b0}
.detail{font-size:12.5px;color:var(--doux)}
.fiche-entete{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.retour{background:var(--carte2);border:1px solid var(--ligne);color:var(--texte);border-radius:10px;padding:8px 12px;font:inherit;margin-bottom:12px}
.conditions{font-size:12.5px;color:var(--doux);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 4px;border-top:1px solid var(--ligne);text-align:left}
th{color:var(--doux);font-weight:500;font-size:12px;border-top:0}
td.n,th.n{text-align:right}
.chiffres{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chiffre{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:12px}
.chiffre .v{font-size:22px;font-weight:700}
.chiffre .l{color:var(--doux);font-size:12px}
.pos{color:var(--vert)}.neg{color:var(--rouge)}
.barre{height:10px;background:var(--carte2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.barre i{display:block;height:100%;background:var(--vert)}
form .champ{margin-bottom:10px}
label{display:block;font-size:12px;color:var(--doux);margin-bottom:4px}
input,select{width:100%;background:var(--carte2);border:1px solid var(--ligne);color:var(--texte);border-radius:10px;padding:10px;font:inherit}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;background:var(--vert);color:#06210f;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700}
.btn.sec{background:var(--carte2);color:var(--texte);border:1px solid var(--ligne)}
.pari{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pari .actions{display:flex;gap:6px;margin-top:8px}
.pari .actions button{flex:1;font-size:13px;padding:8px}
.rapports td:last-child{text-align:right;font-weight:600}
</style>
</head>
<body>
<header>
  <h1><span>Y</span>anis</h1>
  <div id="maj">Chargement…</div>
</header>
<main id="vue"></main>
<nav>
  <button data-onglet="jour" class="actif"><b>🏇</b>Courses</button>
  <button data-onglet="sport"><b>⚽</b>Sport</button>
  <button data-onglet="resultats"><b>🏁</b>Résultats</button>
  <button data-onglet="tableau"><b>📊</b>Tableau</button>
  <button data-onglet="paris"><b>🎟️</b>Mes paris</button>
</nav>
<script>
const D = {}; // donnees chargees
const etat = { onglet: "jour", jour: "aujourdhui", reunion: null, fiche: null, sport: "selections", direct: "fra.1" };
const vue = document.getElementById("vue");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => x == null ? "–" : (100 * x).toFixed(0) + " %";
const euros = x => (x ?? 0).toLocaleString("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
const nomPropre = x => x ? x.replace(/\. /g, ".").replace(/\./g, ". ").trim() : "?";
const heure = d => d ? d.slice(11, 16) : "";
const DISC = {ATTELE:"Trot attelé", MONTE:"Trot monté", PLAT:"Plat", HAIE:"Haies", STEEPLECHASE:"Steeple", CROSS:"Cross"};
const FERRE = {DEFERRE_ANTERIEURS:"D4 avant", DEFERRE_POSTERIEURS:"D4 arrière", DEFERRE_ANTERIEURS_POSTERIEURS:"D4", PROTEGE_ANTERIEURS:"Protégé avant", PROTEGE_POSTERIEURS:"Protégé arrière", PROTEGE_ANTERIEURS_POSTERIEURS:"Protégé 4", PROTEGE_ANTERIEURS_DEFERRRE_POSTERIEURS:"Protégé av., déf. arr.", REFERRE_ANTERIEURS_POSTERIEURS:"Referré"};

function lsGet(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

async function charger(nom) {
  const r = await fetch(`data/${nom}.json?t=${Date.now()}`, {cache: "no-store"});
  if (!r.ok) throw new Error(nom);
  return r.json();
}

async function demarrer() {
  try {
    const [a, h, d, t, f, sp, v2] = await Promise.all(["aujourdhui", "hier", "demain", "tableau", "foot", "sports", "hippique_v2"].map(n => charger(n).catch(() => null)));
    Object.assign(D, {aujourdhui: a, hier: h, demain: d, tableau: t, foot: f, sports: sp, v2});
    fusionnerV2();
    document.getElementById("maj").textContent = t ? `Mis à jour le ${t.maj}` : "Données indisponibles";
  } catch (e) {
    document.getElementById("maj").textContent = "Pas de connexion";
  }
  afficher();
}

/* Le modele v2 (etape 2) remplace l'indice provisoire quand il a pronostique la course */
function fusionnerV2() {
  const v2 = D.v2; if (!v2) return;
  const parCle = {};
  for (const c of v2.courses || []) parCle[`${c.date}/${c.r}/${c.c}`] = c;
  for (const src of ["aujourdhui", "demain"]) for (const reu of D[src]?.reunions || []) for (const c of reu.courses) {
    const x = parCle[`${D[src].date}/${reu.r}/${c.c}`]; if (!x) continue;
    const info = {}; x.classement.forEach((k, i) => info[k.num] = {rang: i + 1, p: k.p_gagnant, pp: k.p_place});
    for (const pt of c.partants) {
      const k = info[pt.num];
      if (k) { pt.rang = k.rang; pt.proba = k.p; pt.p_place = k.pp; pt.value = false; } else { pt.rang = null; }
    }
    c.conseils = x.conseils; c.v2 = true;
  }
}

function afficher() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("actif", b.dataset.onglet === etat.onglet));
  if (etat.onglet !== "sport") arreterDirect();
  ({jour: vueJour, sport: vueSport, resultats: vueResultats, tableau: vueTableau, paris: vueParis})[etat.onglet]();
  window.scrollTo(0, 0);
}

document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  etat.onglet = b.dataset.onglet; etat.fiche = null; afficher();
});

/* ---------- COURSES ---------- */
function topYanis(c) {
  return c.partants.filter(p => p.rang).sort((a, b) => a.rang - b.rang).slice(0, 4).map(p => p.num);
}

function vueJour() {
  if (etat.fiche) return vueFiche();
  const j = D[etat.jour];
  let h = `<div class="bandeau"><b>Mode observation.</b> Aucune formule n'a encore prouvé qu'elle bat le PMU sur son banc d'essai (voir Tableau). Regarde, compare, mais ne mise pas dessus pour l'instant.</div>`;
  h += `<div class="puces">
    <button class="puce ${etat.jour === "aujourdhui" ? "actif" : ""}" data-jour="aujourdhui">Aujourd'hui</button>
    <button class="puce ${etat.jour === "demain" ? "actif" : ""}" data-jour="demain">Demain</button></div>`;
  if (!j || !j.reunions.length) {
    vue.innerHTML = h + `<div class="vide">Pas encore de programme pour ce jour.<br>Yanis le récupère chaque heure.</div>`;
    return lierJour();
  }
  if (!j.reunions.some(r => r.r === etat.reunion)) etat.reunion = j.reunions[0].r;
  h += `<div class="puces">` + j.reunions.map(r =>
    `<button class="puce ${r.r === etat.reunion ? "actif" : ""}" data-reunion="${r.r}">R${r.r} ${esc(r.hippodrome || "")}</button>`).join("") + `</div>`;
  const reu = j.reunions.find(r => r.r === etat.reunion);
  if (reu.temperature != null || reu.ciel) h += `<div class="sous" style="margin-bottom:8px">Météo : ${reu.temperature != null ? reu.temperature + " °C" : ""} ${esc(reu.ciel || "")}</div>`;
  h += reu.courses.map(c => {
    const top = topYanis(c);
    const values = c.partants.filter(p => p.value).map(p => p.num);
    const fini = !!c.arrivee;
    return `<div class="carte course" data-course="${c.c}">
      <div class="heure">${heure(c.depart)}</div>
      <div class="info">
        <div class="titre">C${c.c} · ${esc(c.libelle)}</div>
        <div class="sous">${DISC[c.discipline] || esc(c.discipline || "")} · ${c.distance || "?"} m · ${c.nb_partants || c.partants.length} partants</div>
        ${fini ? `<div class="top">Arrivée : <b>${esc(c.arrivee.split("-").slice(0, 5).join(" - "))}</b></div>`
               : top.length ? `<div class="top">Yanis : <b>${top.join(" - ")}</b>${values.length ? ` <span class="badge b-value">value ${values.join(", ")}</span>` : ""}</div>` : ""}
      </div><div class="fleche">›</div></div>`;
  }).join("");
  vue.innerHTML = h;
  lierJour();
}

function lierJour() {
  vue.querySelectorAll("[data-jour]").forEach(b => b.onclick = () => { etat.jour = b.dataset.jour; etat.reunion = null; afficher(); });
  vue.querySelectorAll("[data-reunion]").forEach(b => b.onclick = () => { etat.reunion = +b.dataset.reunion; afficher(); });
  vue.querySelectorAll("[data-course]").forEach(b => b.onclick = () => {
    etat.fiche = {source: etat.onglet === "resultats" ? etat.res : etat.jour, r: +(b.dataset.r || etat.reunion), c: +b.dataset.course}; afficher();
  });
}

function trouverCourse(f) {
  const reu = D[f.source]?.reunions.find(r => r.r === f.r);
  return [reu, reu?.courses.find(c => c.c === f.c)];
}

function vueFiche() {
  const [reu, c] = trouverCourse(etat.fiche);
  if (!c) { etat.fiche = null; return afficher(); }
  const tries = [...c.partants].sort((a, b) => (a.rang || 99) - (b.rang || 99) || a.num - b.num);
  let h = `<button class="retour" id="retour">‹ Retour</button>
    <div class="carte">
      <div class="fiche-entete"><div>
        <h3>R${reu.r}C${c.c} · ${esc(c.libelle)}</h3>
        <div class="sous">${esc(reu.hippodrome || "")} · ${heure(c.depart)} · ${DISC[c.discipline] || esc(c.discipline || "")} · ${c.distance || "?"} m${c.terrain ? " · terrain " + esc(c.terrain) : ""}${c.allocation ? " · " + c.allocation.toLocaleString("fr-FR") + " €" : ""}</div>
      </div></div>
      ${c.arrivee ? `<div class="top" style="margin-top:8px">Arrivée : <b>${esc(c.arrivee.split("-").join(" - "))}</b></div>` : ""}
      ${c.conditions ? `<div class="conditions">${esc(c.conditions)}</div>` : ""}
    </div>
    <div class="carte">`;
  h = h.replace(/<div class="carte">$/, "");
  if (c.conseils?.length) {
    h += `<div class="carte"><h3>Formules Yanis (étape 2)</h3>` + c.conseils.map(x => `<div style="padding:6px 0;border-top:1px solid var(--ligne)"><div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(x.texte)}</span>${x.validee ? '<span class="badge b-ok">validée</span>' : x.prometteur ? '<span class="badge b-value">prometteur</span>' : '<span class="badge" style="background:#33332a;color:#d9d3a8">observation</span>'}</div>${x.raison ? `<div class="sous">${esc(x.raison)}${x.prometteur ? " (à confirmer sur 6 mois)" : ""}</div>` : ""}${miseConseillee(x) ? `<div class="sous pos">${miseConseillee(x)}</div>` : ""}</div>`).join("") +
      `<div class="sous" style="margin-top:6px">« Validée » seulement si la formule est rentable sur le banc d'essai des derniers mois.</div></div>`;
  }
  h += `<div class="carte">`;
  h += tries.map(p => {
    const np = p.statut !== "PARTANT";
    const sd = p.st_driver || [0, 0, 0], se = p.st_entraineur || [0, 0, 0];
    const tx = s => s[0] ? `${Math.round(100 * s[1] / s[0])} % vict. sur ${s[0]}` : "pas encore de stats";
    const equip = [FERRE[p.deferre] || (p.deferre ? p.deferre.toLowerCase().replace(/_/g, " ") : ""),
                   p.oeilleres && p.oeilleres !== "SANS_OEILLERES" ? "œillères" : "",
                   p.recul && c.discipline && /ATTELE|MONTE/.test(c.discipline) ? p.recul + " m" : "",
                   p.poids ? p.poids + " kg" : "", p.corde ? "corde " + p.corde : ""].filter(Boolean).join(" · ");
    const malin = argentMalin(p);
    return `<div class="partant" style="${np ? "opacity:.45" : ""}">
      <div class="rang ${p.rang ? "r" + p.rang : ""}">${p.rang || "–"}</div>
      <div class="nomc">${p.num}. ${esc(p.nom)} <small>${p.sexe ? esc(p.sexe[0]) : ""}${p.age || ""}</small>
        ${np ? `<span class="badge b-np">non partant</span>` : ""}${p.value ? `<span class="badge b-value">value</span>` : ""}${malin ? `<span class="badge" style="background:#1d3550;color:#9fd0ff">💰 argent malin ${malin}</span>` : ""}
        ${p.place ? `<span class="badge ${p.place <= 3 ? "b-ok" : "b-ko"}">${p.place}e</span>` : ""}${p.incident && !np ? `<span class="badge b-ko">${esc(p.incident.toLowerCase().replace(/_/g, " "))}</span>` : ""}</div>
      <div class="droite"><div class="cote">${p.cote ?? p.cote_ref ?? "–"}</div><div class="pct">Yanis ${pct(p.proba)}${p.p_place != null ? `<br>placé ${pct(p.p_place)}` : ""}</div></div>
      <div class="detail">${esc(nomPropre(p.driver))} (${tx(sd)}) · Ent. ${esc(nomPropre(p.entraineur))} (${tx(se)})<br>
        Musique ${esc(p.musique || "–")}${equip ? " · " + esc(equip) : ""}</div>
    </div>`;
  }).join("");
  h += `</div>`;
  if (c.rapports?.length) h += rapportsHTML(c);
  vue.innerHTML = h;
  document.getElementById("retour").onclick = () => { etat.fiche = null; afficher(); };
}

const PARIS_AFFICHES = ["SIMPLE_GAGNANT", "SIMPLE_PLACE", "COUPLE_GAGNANT", "COUPLE_PLACE", "DEUX_SUR_QUATRE", "TRIO", "MULTI", "QUINTE_PLUS"];
function rapportsHTML(c) {
  const lignes = c.rapports.filter(r => PARIS_AFFICHES.includes(r.pari) && r.rapport);
  if (!lignes.length) return "";
  return `<div class="carte"><h3>Rapports pour 1 €</h3><table class="rapports">` +
    lignes.slice(0, 18).map(r => `<tr><td>${esc(r.libelle)}</td><td>${esc(r.combinaison)}</td><td>${r.rapport.toFixed(2)} €</td></tr>`).join("") +
    `</table></div>`;
}


/* ---------- SPORT ---------- */
const MARCHE_NOM = {"1": "Victoire domicile", "N": "Match nul", "2": "Victoire extérieur", "+2.5": "Plus de 2,5 buts", "-2.5": "Moins de 2,5 buts"};
const dateFr = d => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"});

const ONGLETS_SPORT = [["selections", "⭐ Sélections"], ["foot", "Football"], ["nba", "NBA"], ["nhl", "NHL"], ["nfl", "NFL"],
  ["mlb", "MLB"], ["atp", "Tennis ATP"], ["wta", "Tennis WTA"], ["ufc", "MMA UFC"], ["direct", "🔴 En direct"]];

function vueSport() {
  let h = `<div class="puces">` + ONGLETS_SPORT.map(([k, n]) => `<button class="puce ${etat.sport === k ? "actif" : ""}" data-sp="${k}">${n}</button>`).join("") + `</div>`;
  if (etat.sport === "direct") { vue.innerHTML = h + `<div id="direct"></div>`; lierSport(); return vueDirect(); }
  arreterDirect();
  if (etat.sport === "selections") { vue.innerHTML = h + vueSelections(); return lierSport(); }
  if (etat.sport !== "foot") { vue.innerHTML = h + vueDiscipline(etat.sport); return lierSport(); }
  const f = D.foot;
  if (!f) { vue.innerHTML = h + `<div class="vide">Les données football arrivent au prochain passage de Yanis.</div>`; return lierSport(); }
  const b = f.banc_essai;
  const fiable = b.paris >= 100 && b.roi > 0;
  h += `<div class="bandeau" style="${fiable ? "background:#123222;border-color:#2a6b45;color:#bff0d0" : ""}">
    <b>Double filtre :</b> plus de ${Math.round(100 * f.filtre.proba)} % de chances <b>et</b> une cote qui paie au moins ${Math.round(100 * f.filtre.value)} % de plus que le risque.<br>
    Banc d'essai sur 12 mois (sans voir l'avenir) : ${b.paris} paris, ${b.reussite != null ? Math.round(100 * b.reussite) : "–"} % gagnés, rentabilité
    <b class="${(b.roi || 0) >= 0 ? "pos" : "neg"}">${b.roi != null ? (100 * b.roi).toFixed(1) + " %" : "–"}</b> aux cotes de clôture.
    ${fiable ? "" : "<br><b>Mode observation</b> tant que la rentabilité n'est pas positive sur assez de paris."}</div>`;
  const sel = f.a_venir.filter(m => m.selections.length);
  h += `<h2>Sélections du filtre (${sel.length})</h2>`;
  h += sel.length ? sel.map(m => carteMatch(m, true)).join("") : `<div class="carte sous">Aucun match ne passe le double filtre pour l'instant. C'est normal : Yanis préfère passer son tour.</div>`;
  h += `<h2>Tous les matchs analysés (${f.a_venir.length})</h2>`;
  let jour = "";
  for (const m of f.a_venir) {
    if (m.date !== jour) { jour = m.date; h += `<div class="sous" style="margin:14px 2px 6px;text-transform:capitalize">${dateFr(m.date)}</div>`; }
    h += carteMatch(m, false);
  }
  h += `<div class="sous" style="margin-top:14px">Bibliothèque : ${f.bibliotheque.matchs.toLocaleString("fr-FR")} matchs, ${f.bibliotheque.championnats} championnats, depuis ${esc(f.bibliotheque.debut || "–")}. Mis à jour le ${esc(f.maj)}.</div>`;

function rendreDirect(j) {
  const matchs = [];
  for (const ev of j.events || []) {
    const comps = ev.competitions || (ev.groupings || []).flatMap(g => g.competitions || []);
    for (const c of comps) matchs.push({ev, c});
  }
  if (!matchs.length) return `<div class="vide">Aucun match programmé aujourd'hui dans cette compétition.</div>`;
  const ordre = {in: 0, pre: 1, post: 2};
  matchs.sort((a, b) => (ordre[a.c.status?.type?.state ?? a.ev.status?.type?.state] ?? 3) - (ordre[b.c.status?.type?.state ?? b.ev.status?.type?.state] ?? 3));
  return matchs.slice(0, 40).map(({ev, c}) => {
    const st = c.status?.type || ev.status?.type || {};
    const enCours = st.state === "in";
    const equipes = (c.competitors || []).slice().sort((a, b) => (a.homeAway === "away") - (b.homeAway === "away"));
    const nom = x => x.team?.displayName || x.athlete?.displayName || x.athlete?.shortName || "?";
    const score = x => x.score?.displayValue ?? (typeof x.score === "object" ? "" : x.score) ?? (x.linescores ? x.linescores.map(l => l.value).join(" ") : "");
    const heureTxt = st.state === "pre" ? new Date(c.date || ev.date).toLocaleString("fr-FR", {weekday: "short", hour: "2-digit", minute: "2-digit"}) : esc(st.shortDetail || st.detail || "");
    return `<div class="carte">
      <div class="sous">${enCours ? '<span class="badge b-ko" style="background:#5a1d1d;color:#ffb3b3">EN DIRECT</span> ' : ""}${heureTxt}${ev.shortName && c.competitors?.length > 2 ? "" : ""}</div>
      ${equipes.map(x => `<div style="display:flex;justify-content:space-between;margin-top:4px;${x.winner ? "font-weight:700" : ""}"><span>${esc(nom(x))}</span><span>${st.state === "pre" ? "" : esc(score(x))}</span></div>`).join("")}
    </div>`;
  }).join("") + `<div class="sous" style="margin-top:8px">Scores ESPN, actualisés toutes les 30 secondes.</div>`;
}

/* Argent malin : la cote a fondu d'au moins 30 % depuis le matin (ou depuis le premier releve du jour) */
function argentMalin(p) {
  const depart = p.cote_ref || (p.cotes_suivies && p.cotes_suivies[0] ? p.cotes_suivies[0][1] : null);
  const fin = p.cote;
  if (!depart || !fin || fin >= depart) return "";
  const baisse = 1 - fin / depart;
  return baisse >= 0.30 ? `${depart} → ${fin}` : "";
}

/* Gestion de mise : Kelly divise par 4, plafonne a 100 EUR, seulement pour les paris valides */
function miseConseillee(cns) {
  const cagnotte = lsGet("yanis_cagnotte", 0);
  if (!cagnotte || !cns.validee) return "";
  let mise;
  if (cns.proba && cns.cote && cns.cote > 1) {
    const kelly = (cns.proba * cns.cote - 1) / (cns.cote - 1);
    mise = cagnotte * Math.max(kelly, 0) / 4;
  } else {
    mise = cagnotte * 0.02;
  }
  mise = Math.min(100, Math.max(0, Math.round(mise)));
  return mise >= 1 ? `mise conseillée : ${mise} €` : "";
}

  }

  if (!l?.length) return `<div class="carte sous">Pas encore assez de courses.</div>`;
  return `<div class="carte"><table><tr><th>Nom</th><th class="n">Courses</th><th class="n">Vict.</th><th class="n">% vict.</th><th class="n">% podium</th></tr>` +
    l.map(x => `<tr><td>${esc(x.nom)}</td><td class="n">${x.courses}</td><td class="n">${x.victoires}</td><td class="n">${Math.round(100 * x.victoires / x.courses)}</td><td class="n">${Math.round(100 * x.places / x.courses)}</td></tr>`).join("") + `</table></div>`;
}

/* ---------- MES PARIS ---------- */
const FORMULES = ["Simple gagnant", "Simple placé", "Couplé gagnant", "Couplé placé", "2 sur 4", "Trio", "Multi", "Tiercé", "Quarté+", "Quinté+", "Pick 5", "Super 4", "Autre"];
function vueParis() {
  const paris = lsGet("yanis_paris", []);
  const courses = [];
  for (const src of ["aujourdhui", "demain"]) for (const reu of D[src]?.reunions || []) for (const c of reu.courses)
    courses.push(`${D[src].date} R${reu.r}C${c.c} ${reu.hippodrome || ""} ${heure(c.depart)}`);
  const parFormule = {};
  for (const p of paris) { const f = parFormule[p.formule] ||= {n: 0, g: 0, mise: 0, gain: 0}; f.n++; f.mise += +p.mise || 0; f.gain += +p.gain || 0; if (+p.gain > 0) f.g++; }
  const cagnotte = lsGet("yanis_cagnotte", 0);
  let h = `<h2>Ma cagnotte</h2><div class="carte"><div class="deux"><div class="champ"><label>Cagnotte réservée aux paris (€)</label>
      <input id="cagnotte" type="number" min="0" step="10" inputmode="decimal" value="${cagnotte || ""}" placeholder="ex. 300"></div>
      <div class="champ"><label>&nbsp;</label><button class="btn sec" id="okcagnotte">Enregistrer</button></div></div>
      <div class="sous">Yanis calcule ta mise conseillée (entre 1 et 100 €) seulement sur les paris <b>validés</b>, avec une méthode prudente (Kelly divisé par 4).</div></div>
    <h2>Noter un pari</h2><form class="carte" id="formpari">
    <div class="champ"><label>Course</label><select name="course">${courses.map(c => `<option>${esc(c)}</option>`).join("")}<option>Autre course</option></select></div>
    <div class="deux"><div class="champ"><label>Formule</label><select name="formule">${FORMULES.map(f => `<option>${f}</option>`).join("")}</select></div>
    <div class="champ"><label>Mise (€)</label><input name="mise" type="number" min="0" step="0.5" inputmode="decimal" required></div></div>
    <div class="champ"><label>Chevaux joués (ex. 3-7-12)</label><input name="chevaux" required></div>
    <button class="btn">Enregistrer le pari</button></form>`;
  if (Object.keys(parFormule).length) {
    h += `<h2>Réussite par formule</h2><div class="carte"><table><tr><th>Formule</th><th class="n">Paris</th><th class="n">Gagnés</th><th class="n">Bilan</th></tr>` +
      Object.entries(parFormule).map(([f, x]) => `<tr><td>${esc(f)}</td><td class="n">${x.n}</td><td class="n">${x.g}</td><td class="n ${x.gain - x.mise >= 0 ? "pos" : "neg"}">${euros(x.gain - x.mise)}</td></tr>`).join("") + `</table></div>`;
  }
  h += `<h2>Mes paris (${paris.length})</h2>`;
  h += paris.length ? [...paris].reverse().map(p => `<div class="carte">
      <div class="pari"><div><b>${esc(p.formule)}</b> · ${esc(p.chevaux)}<div class="sous">${esc(p.course)}</div></div>
      <div style="text-align:right"><div>${euros(+p.mise)}</div><div class="sous ${p.gain == null ? "" : +p.gain > 0 ? "pos" : "neg"}">${p.gain == null ? "en attente" : "retour " + euros(+p.gain)}</div></div></div>
      <div class="actions"><button class="btn sec" data-gain="${p.id}">Saisir le gain</button><button class="btn sec" data-perdu="${p.id}">Perdu</button><button class="btn sec" data-suppr="${p.id}">Supprimer</button></div>
    </div>`).join("") : `<div class="vide">Aucun pari noté pour l'instant.</div>`;
  h += `<div class="sous" style="margin-top:12px">Tes paris sont gardés sur ce téléphone uniquement.</div>`;
  vue.innerHTML = h;
  document.getElementById("okcagnotte").onclick = () => { lsSet("yanis_cagnotte", +document.getElementById("cagnotte").value || 0); afficher(); };
  document.getElementById("formpari").onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    paris.push({id: Date.now(), course: f.get("course"), formule: f.get("formule"), mise: +f.get("mise"), chevaux: f.get("chevaux"), gain: null});
    lsSet("yanis_paris", paris); afficher();
  };
  const maj = (id, fn) => { const p = paris.find(x => x.id === +id); if (p) { fn(p); lsSet("yanis_paris", paris); afficher(); } };
  vue.querySelectorAll("[data-gain]").forEach(b => b.onclick = () => {
    const v = prompt("Somme reçue pour ce pari (en €) :"); if (v !== null && v !== "") maj(b.dataset.gain, p => p.gain = +v.replace(",", "."));
  });
  vue.querySelectorAll("[data-perdu]").forEach(b => b.onclick = () => maj(b.dataset.perdu, p => p.gain = 0));
  vue.querySelectorAll("[data-suppr]").forEach(b => b.onclick = () => {
    if (confirm("Supprimer ce pari ?")) { const i = paris.findIndex(x => x.id === +b.dataset.suppr); paris.splice(i, 1); lsSet("yanis_paris", paris); afficher(); }
  });
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("visibilitychange", () => { if (!document.hidden) demarrer(); });
demarrer();
</script>
</body>
</html>
