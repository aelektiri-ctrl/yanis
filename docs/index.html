<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1512">
<title>Yanis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
:root{
  --fond:#0e1512; --carte:#16201b; --carte2:#1d2a24; --ligne:#2a3a32;
  --texte:#eef3ef; --doux:#9fb2a7; --vert:#3ddc84; --or:#f2c14e; --rouge:#ff6b6b; --bleu:#6ab7ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--texte);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(14,21,18,.95);backdrop-filter:blur(8px);padding:14px 16px 10px;border-bottom:1px solid var(--ligne)}
header h1{margin:0;font-size:22px;letter-spacing:.5px}
header h1 span{color:var(--vert)}
#maj{color:var(--doux);font-size:12px}
main{padding:12px 16px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b110e;border-top:1px solid var(--ligne);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--doux);padding:10px 0 12px;font:inherit;font-size:11.5px}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.actif{color:var(--vert)}
.bandeau{background:#2b2410;border:1px solid #5a4a1a;color:#f6dd97;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.puces{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.puce{flex:none;background:var(--carte);border:1px solid var(--ligne);color:var(--texte);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px}
.puce.actif{background:var(--vert);color:#06210f;border-color:var(--vert);font-weight:600}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:12px;margin-bottom:10px}
.course{display:flex;gap:12px;align-items:center}
.heure{font-weight:700;font-size:17px;min-width:52px}
.course .info{flex:1;min-width:0}
.course .titre{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sous{color:var(--doux);font-size:12.5px}
.top{font-size:12.5px;margin-top:3px}
.top b{color:var(--vert)}
.fleche{color:var(--doux);font-size:20px}
h2{font-size:17px;margin:18px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.vide{color:var(--doux);text-align:center;padding:40px 10px}
.partant{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--ligne)}
.partant:first-of-type{border-top:0}
.rang{grid-row:span 2;align-self:center;width:30px;height:30px;border-radius:9px;background:var(--carte2);display:grid;place-items:center;font-weight:700;font-size:13px}
.rang.r1{background:var(--vert);color:#06210f}.rang.r2,.rang.r3{background:#244d36;color:var(--vert)}
.nomc{font-weight:600}
.nomc small{color:var(--doux);font-weight:400}
.droite{text-align:right;grid-row:span 2;align-self:center}
.cote{font-weight:700;font-size:16px}
.pct{font-size:12px;color:var(--doux)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:4px;vertical-align:1px}
.b-value{background:var(--or);color:#2a1d00}
.b-np{background:#3a2020;color:#ff9b9b}
.b-ok{background:#1d4d33;color:var(--vert)}
.b-ko{background:#3a2a2a;color:#ffb0b0}
.detail{font-size:12.5px;color:var(--doux)}
.fiche-entete{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.retour{background:var(--carte2);border:1px solid var(--ligne);color:var(--texte);border-radius:10px;padding:8px 12px;font:inherit;margin-bottom:12px}
.conditions{font-size:12.5px;color:var(--doux);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 4px;border-top:1px solid var(--ligne);text-align:left}
th{color:var(--doux);font-weight:500;font-size:12px;border-top:0}
td.n,th.n{text-align:right}
.chiffres{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chiffre{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:12px}
.chiffre .v{font-size:22px;font-weight:700}
.chiffre .l{color:var(--doux);font-size:12px}
.pos{color:var(--vert)}.neg{color:var(--rouge)}
.barre{height:10px;background:var(--carte2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.barre i{display:block;height:100%;background:var(--vert)}
form .champ{margin-bottom:10px}
label{display:block;font-size:12px;color:var(--doux);margin-bottom:4px}
input,select{width:100%;background:var(--carte2);border:1px solid var(--ligne);color:var(--texte);border-radius:10px;padding:10px;font:inherit}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;background:var(--vert);color:#06210f;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700}
.btn.sec{background:var(--carte2);color:var(--texte);border:1px solid var(--ligne)}
.pari{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pari .actions{display:flex;gap:6px;margin-top:8px}
.pari .actions button{flex:1;font-size:13px;padding:8px}
.rapports td:last-child{text-align:right;font-weight:600}
</style>
</head>
<body>
<header>
  <h1><span>Y</span>anis</h1>
  <div id="maj">Chargement…</div>
</header>
<main id="vue"></main>
<nav>
  <button data-onglet="jour" class="actif"><b>🏇</b>Courses</button>
  <button data-onglet="sport"><b>⚽</b>Sport</button>
  <button data-onglet="resultats"><b>🏁</b>Résultats</button>
  <button data-onglet="tableau"><b>📊</b>Tableau</button>
  <button data-onglet="paris"><b>🎟️</b>Mes paris</button>
</nav>
<script>
const D = {}; // donnees chargees
const etat = { onglet: "jour", jour: "aujourdhui", reunion: null, fiche: null, sport: "selections", direct: "fra.1", mode: "toutes" };
const vue = document.getElementById("vue");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => x == null ? "–" : (100 * x).toFixed(0) + " %";
const euros = x => (x ?? 0).toLocaleString("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
const nomPropre = x => x ? x.replace(/\. /g, ".").replace(/\./g, ". ").trim() : "?";
const heure = d => d ? d.slice(11, 16) : "";
const DISC = {ATTELE:"Trot attelé", MONTE:"Trot monté", PLAT:"Plat", HAIE:"Haies", STEEPLECHASE:"Steeple", CROSS:"Cross"};
const FERRE = {DEFERRE_ANTERIEURS:"D4 avant", DEFERRE_POSTERIEURS:"D4 arrière", DEFERRE_ANTERIEURS_POSTERIEURS:"D4", PROTEGE_ANTERIEURS:"Protégé avant", PROTEGE_POSTERIEURS:"Protégé arrière", PROTEGE_ANTERIEURS_POSTERIEURS:"Protégé 4", PROTEGE_ANTERIEURS_DEFERRRE_POSTERIEURS:"Protégé av., déf. arr.", REFERRE_ANTERIEURS_POSTERIEURS:"Referré"};

function lsGet(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

async function charger(nom) {
  const r = await fetch(`data/${nom}.json?t=${Date.now()}`, {cache: "no-store"});
  if (!r.ok) throw new Error(nom);
  return r.json();
}

async function demarrer() {
  try {
    const [a, h, d, t, f, sp, v2] = await Promise.all(["aujourdhui", "hier", "demain", "tableau", "foot", "sports", "hippique_v2"].map(n => charger(n).catch(() => null)));
    Object.assign(D, {aujourdhui: a, hier: h, demain: d, tableau: t, foot: f, sports: sp, v2});
    fusionnerV2();
    document.getElementById("maj").textContent = t ? `Mis à jour le ${t.maj}` : "Données indisponibles";
  } catch (e) {
    document.getElementById("maj").textContent = "Pas de connexion";
  }
  afficher();
}

/* Le modele v2 (etape 2) remplace l'indice provisoire quand il a pronostique la course */
function fusionnerV2() {
  const v2 = D.v2; if (!v2) return;
  const parCle = {};
  for (const c of v2.courses || []) parCle[`${c.date}/${c.r}/${c.c}`] = c;
  for (const src of ["aujourdhui", "demain"]) for (const reu of D[src]?.reunions || []) for (const c of reu.courses) {
    const x = parCle[`${D[src].date}/${reu.r}/${c.c}`]; if (!x) continue;
    const info = {}; x.classement.forEach((k, i) => info[k.num] = {rang: i + 1, p: k.p_gagnant, pp: k.p_place});
    for (const pt of c.partants) {
      const k = info[pt.num];
      if (k) { pt.rang = k.rang; pt.proba = k.p; pt.p_place = k.pp; pt.value = false; } else { pt.rang = null; }
    }
    c.conseils = x.conseils; c.v2 = true;
  }
}

function afficher() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("actif", b.dataset.onglet === etat.onglet));
  if (etat.onglet !== "sport") arreterDirect();
  ({jour: vueJour, sport: vueSport, resultats: vueResultats, tableau: vueTableau, paris: vueParis})[etat.onglet]();
  window.scrollTo(0, 0);
}

document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  etat.onglet = b.dataset.onglet; etat.fiche = null; afficher();
});

/* ---------- COURSES ---------- */
function topYanis(c) {
  return c.partants.filter(p => p.rang).sort((a, b) => a.rang - b.rang).slice(0, 4).map(p => p.num);
}

/* Seulement les courses ou l'on peut parier, et pas les reunions masquees par Abdel (absentes de Betclic) */
const masquees = () => lsGet("yanis_masquees", []);
function reunionsJouables(j) {
  const m = masquees();
  return (j?.reunions || []).filter(r => !m.includes(r.hippodrome))
    .map(r => ({...r, courses: r.courses.filter(c => c.paris == null || c.paris.length > 0)}))
    .filter(r => r.courses.length);
}

function blocPepites() {
  const peps = (D.v2?.pepite || []).filter(x => x.date === D.aujourdhui?.date);
  if (!peps.length) return "";
  const st = D.v2.banc_essai?.strategies || {};
  const sg = st.pepite_sg || {}, sp = st.pepite_sp || {};
  const statut = x => x.validee ? '<span class="badge b-ok">validé</span>' : (x.roi > 0 ? '<span class="badge b-value">prometteur</span>' : '<span class="badge" style="background:#33332a;color:#d9d3a8">observation</span>');
  const reus = Object.fromEntries((D.aujourdhui?.reunions || []).map(r => [r.r, r.hippodrome]));
  return `<div class="carte" style="border-color:#5a4a1a;background:#1f1a0c">
    <h3>💎 Les pépites du jour</h3>
    <div class="sous" style="margin-bottom:6px">Les outsiders (cote 8 ou plus) que Yanis juge les plus sous-estimés aujourd'hui, en France.</div>` +
    peps.map((x, i) => `<div style="padding:8px 0;border-top:1px solid #3a321a">
      <div style="display:flex;justify-content:space-between;gap:8px"><b>${i === 0 ? "💎 " : ""}${x.num}. ${esc(x.nom)}</b><b>cote ${x.cote}</b></div>
      <div class="sous">R${x.r}C${x.c} ${esc(reus[x.r] || "")} · départ ${esc((x.depart || "").slice(11, 16))}</div>
      <div class="sous">${esc(x.texte)} Placé : ${pct(x.p_place)}.</div>
      <div class="deux" style="margin-top:6px">
        <button class="btn sec" style="padding:7px" data-joue='${esc(JSON.stringify({type: "turf", cle: `${x.date}/${x.r}/${x.c}`, formule: "Simple gagnant", chevaux: String(x.num)}))}'>Joué gagnant</button>
        <button class="btn sec" style="padding:7px" data-joue='${esc(JSON.stringify({type: "turf", cle: `${x.date}/${x.r}/${x.c}`, formule: "Simple placé", chevaux: String(x.num)}))}'>Joué placé</button></div>
    </div>`).join("") +
    `<div class="sous" style="margin-top:6px">Banc d'essai de la pépite n°1 : gagnant ${sg.roi != null ? (100 * sg.roi).toFixed(1) + " %" : "–"} ${statut(sg)} · placé ${sp.roi != null ? (100 * sp.roi).toFixed(1) + " %" : "–"} ${statut(sp)} sur ${sp.paris || 0} jours. Il en faut au moins 150 pour valider.</div></div>`;
}

function infoPartants(c) {
  const np = c.partants.filter(p => p.statut !== "PARTANT").length;
  const vrais = c.partants.length - np;
  return {np, vrais, places: vrais <= 7 ? 2 : 3, ordre: vrais <= 7};
}

function carteCourse(c, reu, avecReunion, enAvant) {
  const top = topYanis(c);
  const ip = infoPartants(c);
  const src = ["aujourdhui", "demain", "hier"].find(k => D[k]?.reunions?.some(r => r.courses.includes(c)));
  const v = (D.v2?.courses || []).find(x => src && x.date === D[src].date && x.r === reu.r && x.c === c.c);
  const nd = v ? niveauDesordre(v.desordre) : null;
  const values = c.partants.filter(p => p.value).map(p => p.num);
  const fini = !!c.arrivee;
  return `<div class="carte course" data-course="${c.c}" data-r="${reu.r}" style="${enAvant ? "border-color:var(--vert);box-shadow:0 0 0 1px var(--vert) inset" : ""}">
    <div class="heure">${heure(c.depart)}</div>
    <div class="info">
      ${enAvant ? `<div class="sous pos" style="font-weight:600">Prochain départ</div>` : ""}
      <div class="titre">${avecReunion ? `R${reu.r}C${c.c} ${esc(reu.hippodrome || "")}${reu.pays && reu.pays !== "FRA" ? " 🌍" : ""} · ` : `C${c.c} · `}${esc(c.libelle)}</div>
      <div class="sous">${DISC[c.discipline] || esc(c.discipline || "")} · ${c.distance || "?"} m · ${ip.vrais} partants${ip.np ? ` <span class="badge b-np">${ip.np} non-partant${ip.np > 1 ? "s" : ""}</span>` : ""}${ip.ordre ? ` <span class="badge" style="background:#1d3550;color:#9fd0ff">2 places · ordre</span>` : ""}${nd && nd.txt === "élevé" && !c.arrivee ? ` <span class="badge" style="background:${nd.coul};color:${nd.fg}">⚠️ course piège</span>` : ""}${v?.outsiders?.length && !c.arrivee ? ` <span class="badge" style="background:#3a2020;color:#ffb0b0">🐺 ${v.outsiders.map(o => o.num).join(", ")}</span>` : ""}</div>
      ${fini ? `<div class="top">Arrivée : <b>${esc(c.arrivee.split("-").slice(0, 5).join(" - "))}</b></div>`
             : top.length ? `<div class="top">Yanis : <b>${top.join(" - ")}</b>${values.length ? ` <span class="badge b-value">value ${values.join(", ")}</span>` : ""}</div>` : ""}
    </div><div class="fleche">›</div></div>`;
}

function vueToutes(j) {
  const toutes = [];
  for (const reu of j.reunions) for (const c of reu.courses) toutes.push({c, reu});
  toutes.sort((a, b) => (a.c.depart || "").localeCompare(b.c.depart || ""));
  const aVenir = toutes.filter(x => !x.c.arrivee), finies = toutes.filter(x => x.c.arrivee).reverse();
  let h = "";
  if (aVenir.length) {
    h += `<h2>À venir (${aVenir.length})</h2>` + aVenir.map((x, i) => carteCourse(x.c, x.reu, true, i === 0)).join("");
  } else {
    h += `<div class="carte sous">Toutes les courses de la journée sont terminées.</div>`;
  }
  if (finies.length) h += `<h2>Terminées (${finies.length})</h2>` + finies.map(x => carteCourse(x.c, x.reu, true, false)).join("");
  return h;
}

function vueJour() {
  if (etat.fiche) return vueFiche();
  const jBrut = D[etat.jour];
  const j = jBrut ? {...jBrut, reunions: reunionsJouables(jBrut)} : null;
  const cachees = (jBrut?.reunions || []).filter(r => masquees().includes(r.hippodrome));
  let h = `<div class="bandeau"><b>Mode observation.</b> Aucune formule n'a encore prouvé qu'elle bat le PMU sur son banc d'essai (voir Tableau). Regarde, compare, mais ne mise pas dessus pour l'instant.</div>`;
  h += `<div class="puces">
    <button class="puce ${etat.jour === "aujourdhui" ? "actif" : ""}" data-jour="aujourdhui">Aujourd'hui</button>
    <button class="puce ${etat.jour === "demain" ? "actif" : ""}" data-jour="demain">Demain</button></div>`;
  const blocMasquees = cachees.length ? `<div class="carte"><div class="sous" style="margin-bottom:6px">Réunions masquées (pas sur Betclic) :</div>` +
    cachees.map(r => `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><span>${esc(r.hippodrome)}</span><button class="btn sec" style="width:auto;padding:6px 10px" data-reafficher="${esc(r.hippodrome)}">Réafficher</button></div>`).join("") + `</div>` : "";
  if (!j || !j.reunions.length) {
    vue.innerHTML = h + `<div class="vide">Pas encore de programme jouable pour ce jour.<br>Yanis le récupère toutes les 15 minutes.</div>` + blocMasquees;
    return lierJour();
  }
  if (etat.jour === "aujourdhui") h += blocPepites();
  h += `<div class="puces">
    <button class="puce ${etat.mode === "toutes" ? "actif" : ""}" data-mode="toutes">🕐 Toutes les courses</button>
    <button class="puce ${etat.mode === "reunion" ? "actif" : ""}" data-mode="reunion">Par réunion</button></div>`;
  if (etat.mode === "toutes") {
    vue.innerHTML = h + vueToutes(j) + blocMasquees;
    return lierJour();
  }
  if (!j.reunions.some(r => r.r === etat.reunion)) etat.reunion = j.reunions[0].r;
  h += `<div class="puces">` + j.reunions.map(r =>
    `<button class="puce ${r.r === etat.reunion ? "actif" : ""}" data-reunion="${r.r}">R${r.r} ${esc(r.hippodrome || "")}</button>`).join("") + `</div>`;
  const reu = j.reunions.find(r => r.r === etat.reunion);
  h += `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">
    <div class="sous">${reu.pays && reu.pays !== "FRA" ? "🌍 " + esc(reu.pays) + " · " : ""}${reu.temperature != null || reu.ciel ? `Météo : ${reu.temperature != null ? reu.temperature + " °C" : ""} ${esc(reu.ciel || "")}` : ""}</div>
    <button class="btn sec" style="width:auto;padding:6px 10px;font-size:12.5px" data-masquer="${esc(reu.hippodrome || "")}">Pas sur Betclic ? Masquer</button></div>`;
  h += reu.courses.map(c => carteCourse(c, reu, false, false)).join("") + blocMasquees;
  vue.innerHTML = h;
  lierJour();
}

function lierJour() {
  vue.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { etat.mode = b.dataset.mode; afficher(); });
  vue.querySelectorAll("[data-masquer]").forEach(b => b.onclick = () => {
    if (!confirm(`Masquer ${b.dataset.masquer} ? Yanis ne l'affichera plus, aujourd'hui et les prochaines fois. Tu pourras la réafficher en bas de la page.`)) return;
    const m = masquees(); if (!m.includes(b.dataset.masquer)) m.push(b.dataset.masquer); lsSet("yanis_masquees", m); etat.reunion = null; afficher();
  });
  vue.querySelectorAll("[data-reafficher]").forEach(b => b.onclick = () => {
    lsSet("yanis_masquees", masquees().filter(x => x !== b.dataset.reafficher)); afficher();
  });
  vue.querySelectorAll("[data-jour]").forEach(b => b.onclick = () => { etat.jour = b.dataset.jour; etat.reunion = null; afficher(); });
  vue.querySelectorAll("[data-reunion]").forEach(b => b.onclick = () => { etat.reunion = +b.dataset.reunion; afficher(); });
  vue.querySelectorAll("[data-course]").forEach(b => b.onclick = () => {
    etat.fiche = {source: etat.onglet === "resultats" ? etat.res : etat.jour, r: +(b.dataset.r || etat.reunion), c: +b.dataset.course}; afficher();
  });
}

function trouverCourse(f) {
  const reu = D[f.source]?.reunions.find(r => r.r === f.r);
  return [reu, reu?.courses.find(c => c.c === f.c)];
}

function vueFiche() {
  const [reu, c] = trouverCourse(etat.fiche);
  if (!c) { etat.fiche = null; return afficher(); }
  const tries = [...c.partants].sort((a, b) => (a.rang || 99) - (b.rang || 99) || a.num - b.num);
  const avecCote = c.partants.filter(p => p.statut === "PARTANT" && (p.cote || p.cote_ref));
  const favoriNum = avecCote.length ? avecCote.reduce((a, b) => ((a.cote || a.cote_ref) <= (b.cote || b.cote_ref) ? a : b)).num : null;
  let h = `<button class="retour" id="retour">‹ Retour</button>
    <div class="carte">
      <div class="fiche-entete"><div>

      `<div class="sous" style="margin-top:6px">« Validée » seulement si la formule est rentable sur le banc d'essai des derniers mois.</div></div>`;
  }
  h += `<div class="carte">`;
  h += tries.map(p => {
    const np = p.statut !== "PARTANT";
    const sd = p.st_driver || [0, 0, 0], se = p.st_entraineur || [0, 0, 0];
    const tx = s => s[0] ? `${Math.round(100 * s[1] / s[0])} % vict. sur ${s[0]}` : "pas encore de stats";
    const equip = [FERRE[p.deferre] || (p.deferre ? p.deferre.toLowerCase().replace(/_/g, " ") : ""),
                   p.oeilleres && p.oeilleres !== "SANS_OEILLERES" ? "œillères" : "",

    const malin = argentMalin(p);

      <div class="droite"><div class="cote">${p.cote ?? p.cote_ref ?? "–"}</div><div class="pct">Yanis ${pct(p.proba)}${p.p_place != null ? `<br>placé ${pct(p.p_place)}` : ""}</div></div>

    </div>`;

  h += `</div>`;

function vueSport() {

function barre1N2(p) {
  const c = (x, coul) => `<i style="width:${100 * x}%;background:${coul}"></i>`;
  return `<div style="display:flex;height:8px;border-radius:99px;overflow:hidden;margin:8px 0 4px;background:var(--carte2)">${c(p["1"], "var(--vert)")}${c(p.N, "#7d8f86")}${c(p["2"], "var(--bleu)")}</div>

}

function carteMatch(m, detail) {
  const p = m.probas;
  const cote = k => m.cotes[k]?.moy ? m.cotes[k].moy.toFixed(2) : "–";
  let h = `<div class="carte">
    <div class="sous">${esc(m.ligue)} · ${detail ? dateFr(m.date) + " · " : ""}${esc(m.heure || "")}</div>
    <div style="font-weight:600;margin-top:2px">${esc(m.dom)} – ${esc(m.ext)}</div>
    ${barre1N2(p)}
    <div class="sous" style="margin-top:4px">Cotes moyennes 1/N/2 : ${cote("1")} / ${cote("N")} / ${cote("2")} · +2,5 buts : ${pct(p["+2.5"])} · les deux marquent : ${pct(p["BTTS oui"])} · score probable ${esc(m.score)}</div>`;
  for (const s of m.selections) {
    h += `<div style="margin-top:8px;padding:8px 10px;border-radius:10px;background:#2b2410;border:1px solid #5a4a1a">

  }
  return h + `</div>`;
}


const fiabiliteSport = b => b && b.paris >= 100 && b.roi > 0;

function bandeauBanc(b, nomMatchs) {

}

function vueDiscipline(k) {
  const S = D.sports?.sports?.[k];

function vueSelections() {

const DIRECT = [

  ["uel", "Europa League", "soccer/uefa.europa"], ["nba", "NBA", "basketball/nba"], ["nhl", "NHL", "hockey/nhl"],
  ["nfl", "NFL", "football/nfl"], ["atp", "Tennis ATP", "tennis/atp"], ["wta", "Tennis WTA", "tennis/wta"], ["ufc", "MMA UFC", "mma/ufc"], ["f1", "Formule 1", "racing/f1"],
];
let minuterieDirect = null;
function arreterDirect() { if (minuterieDirect) { clearInterval(minuterieDirect); minuterieDirect = null; } }

function lierSport() {
  vue.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => { etat.sport = b.dataset.sp; afficher(); });
}

async function vueDirect() {
  const zone = document.getElementById("direct");
  const choix = DIRECT.find(x => x[0] === etat.direct) || DIRECT[0];
  zone.innerHTML = `<div class="puces">${DIRECT.map(x => `<button class="puce ${x[0] === choix[0] ? "actif" : ""}" data-dir="${x[0]}">${x[1]}</button>`).join("")}</div><div id="scores" class="sous">Chargement…</div>`;
  zone.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => { etat.direct = b.dataset.dir; arreterDirect(); vueDirect(); });
  const charge = async () => {
    const cible = document.getElementById("scores"); if (!cible) return arreterDirect();
    try {
      const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${choix[2]}/scoreboard?t=${Date.now()}`);
      const j = await r.json();
      cible.innerHTML = rendreDirect(j);
    } catch (e) {
      cible.innerHTML = `<div class="vide">Impossible de joindre les scores en direct pour l'instant.</div>`;
    }
  };
  await charge();
  arreterDirect(); minuterieDirect = setInterval(charge, 30000);
}

function rendreDirect(j) {
  const matchs = [];
  for (const ev of j.events || []) {
    const comps = ev.competitions || (ev.groupings || []).flatMap(g => g.competitions || []);
    for (const c of comps) matchs.push({ev, c});
  }
  if (!matchs.length) return `<div class="vide">Aucun match programmé aujourd'hui dans cette compétition.</div>`;
  const ordre = {in: 0, pre: 1, post: 2};
  matchs.sort((a, b) => (ordre[a.c.status?.type?.state ?? a.ev.status?.type?.state] ?? 3) - (ordre[b.c.status?.type?.state ?? b.ev.status?.type?.state] ?? 3));
  return matchs.slice(0, 40).map(({ev, c}) => {
    const st = c.status?.type || ev.status?.type || {};
    const enCours = st.state === "in";
    const equipes = (c.competitors || []).slice().sort((a, b) => (a.homeAway === "away") - (b.homeAway === "away"));
    const nom = x => x.team?.displayName || x.athlete?.displayName || x.athlete?.shortName || "?";
    const score = x => x.score?.displayValue ?? (typeof x.score === "object" ? "" : x.score) ?? (x.linescores ? x.linescores.map(l => l.value).join(" ") : "");
    const heureTxt = st.state === "pre" ? new Date(c.date || ev.date).toLocaleString("fr-FR", {weekday: "short", hour: "2-digit", minute: "2-digit"}) : esc(st.shortDetail || st.detail || "");
    return `<div class="carte">
      <div class="sous">${enCours ? '<span class="badge b-ko" style="background:#5a1d1d;color:#ffb3b3">EN DIRECT</span> ' : ""}${heureTxt}${ev.shortName && c.competitors?.length > 2 ? "" : ""}</div>
      ${equipes.map(x => `<div style="display:flex;justify-content:space-between;margin-top:4px;${x.winner ? "font-weight:700" : ""}"><span>${esc(nom(x))}</span><span>${st.state === "pre" ? "" : esc(score(x))}</span></div>`).join("")}
    </div>`;
  }).join("") + `<div class="sous" style="margin-top:8px">Scores ESPN, actualisés toutes les 30 secondes.</div>`;
}

/* Argent malin : la cote a fondu d'au moins 30 % depuis le matin (ou depuis le premier releve du jour) */
function derniereHeure(p) {
  const s = p.cotes_suivies; if (!s || s.length < 2) return "";
  const maintenant = new Date(); const lim = maintenant.getHours() * 60 + maintenant.getMinutes() - 60;
  const avant = s.find(x => { const [h, m] = x[0].split(":").map(Number); return h * 60 + m >= lim; }) || s[0];
  const fin = s[s.length - 1][1];
  return avant[1] && fin < avant[1] * 0.75 ? `${avant[1]} → ${fin}` : "";
}

function argentMalin(p) {
  const depart = p.cote_ref || (p.cotes_suivies && p.cotes_suivies[0] ? p.cotes_suivies[0][1] : null);
  const fin = p.cote;
  if (!depart || !fin || fin >= depart) return "";
  const baisse = 1 - fin / depart;
  return baisse >= 0.30 ? `${depart} → ${fin}` : "";
}

/* Gestion de mise : Kelly divise par 4, plafonne a 100 EUR, seulement pour les paris valides */
function miseConseillee(cns) {
  const cagnotte = lsGet("yanis_cagnotte", 0);
  if (!cagnotte || !cns.validee) return "";
  let mise;
  if (cns.proba && cns.cote && cns.cote > 1) {
    const kelly = (cns.proba * cns.cote - 1) / (cns.cote - 1);
    mise = cagnotte * Math.max(kelly, 0) / 4;
  } else {
    mise = cagnotte * 0.02;
  }
  mise = Math.min(100, Math.max(0, Math.round(mise)));
  return mise >= 1 ? `mise conseillée : ${mise} €` : "";
}

/* ---------- MES PARIS (suivi de ce qui est joue sur Betclic) ---------- */
const FORMULES_TURF = ["Simple gagnant", "Simple placé", "Couplé gagnant", "Couplé placé", "Couplé ordre", "2 sur 4", "Trio", "Trio ordre", "Multi", "Mini multi", "Tiercé", "Quarté+", "Quinté+", "Pick 5", "Super 4", "Autre"];
const CODE_PMU = {"Simple gagnant": "SIMPLE_GAGNANT", "Simple placé": "SIMPLE_PLACE", "Couplé gagnant": "COUPLE_GAGNANT",
  "Couplé placé": "COUPLE_PLACE", "Couplé ordre": "COUPLE_ORDRE", "2 sur 4": "DEUX_SUR_QUATRE", "Trio": "TRIO",
  "Trio ordre": "TRIO_ORDRE", "Multi": "MULTI", "Mini multi": "MINI_MULTI"};
const nums = x => (String(x || "").match(/\d+/g) || []).map(Number);
const memeEnsemble = (a, b) => a.length === b.length && a.every(v => b.includes(v));

function lireParis() {
  return lsGet("yanis_paris", []).map(p => ({type: "turf", ...p}));
}

/* Reglement automatique des paris hippiques des que l'arrivee est connue (rapports PMU = estimation) */
function reglerAuto() {
  const paris = lireParis();
  let change = false;
  for (const p of paris) {
    if (p.gain != null || p.type !== "turf" || !p.cle) continue;
    const [date, r, c] = p.cle.split("/");
    const src = ["aujourdhui", "hier", "demain"].find(k => D[k]?.date === date);
    const reu = src && D[src].reunions.find(x => x.r === +r);
    const course = reu && reu.courses.find(x => x.c === +c);
    if (!course || !course.arrivee) continue;
    const code = CODE_PMU[p.formule];
    if (!code) continue;
    const jeu = nums(p.chevaux);
    let rapport = 0;
    for (const rp of course.rapports || []) {
      if (rp.pari !== code || !rp.rapport) continue;
      const comb = nums(rp.combinaison);
      if (code.endsWith("_ORDRE")) {
        if (comb.length === jeu.length && comb.every((v, i) => v === jeu[i])) { rapport = rp.rapport; break; }
      } else if (code === "MULTI" || code === "MINI_MULTI") {
        if ((rp.libelle || "").includes(`Multi en ${jeu.length}`) && comb.every(v => jeu.includes(v))) { rapport = rp.rapport; break; }
      } else if (memeEnsemble(comb, jeu)) { rapport = rp.rapport; break; }
    }
    p.gain = Math.round(p.mise * rapport * 100) / 100;
    p.auto = true;
    change = true;
  }
  if (change) lsSet("yanis_paris", paris);
  return paris;
}

function compteBetclic() {
  const paris = reglerAuto();
  const mvts = lsGet("yanis_compte", []);
  const depots = mvts.filter(m => m.type === "depot").reduce((s, m) => s + m.montant, 0);
  const retraits = mvts.filter(m => m.type === "retrait").reduce((s, m) => s + m.montant, 0);
  const joue = paris.reduce((s, p) => s + (+p.mise || 0), 0);
  const regles = paris.filter(p => p.gain != null);
  const gagne = regles.reduce((s, p) => s + (+p.gain || 0), 0);
  const miseReglee = regles.reduce((s, p) => s + (+p.mise || 0), 0);
  return {paris, mvts, depots, retraits, joue, gagne, attente: joue - miseReglee,
          bilan: gagne - miseReglee, solde: depots - retraits - joue + gagne,
          reussite: regles.length ? regles.filter(p => +p.gain > 0).length / regles.length : 0};
}

      <button class="btn" style="margin-top:6px">Enregistrer le pari</button>
      <div class="sous" style="margin-top:6px">${type === "turf" ? "Yanis marque tout seul le pari gagné ou perdu dès l'arrivée, avec le rapport PMU (proche de celui de Betclic, tu peux corriger)." : "Après le match, touche « Gagné » ou « Perdu » : le gain se calcule avec ta cote."}</div>
    </form>

    <h2>Ma cagnotte</h2><div class="carte"><div class="deux"><div class="champ"><label>Cagnotte réservée aux paris (€)</label>
      <input id="cagnotte" type="number" min="0" step="10" inputmode="decimal" value="${cagnotte || ""}" placeholder="ex. 300"></div>
      <div class="champ"><label>&nbsp;</label><button class="btn sec" id="okcagnotte">Enregistrer</button></div></div>
      <div class="sous">Sert à calculer ta mise conseillée (1 à 100 €), seulement sur les paris <b>validés</b>.</div></div>`;

  if (Object.keys(parFormule).length) {
    h += `<h2>Réussite par formule</h2><div class="carte"><table><tr><th>Formule</th><th class="n">Paris</th><th class="n">Gagnés</th><th class="n">Bilan</th></tr>` +
      Object.entries(parFormule).map(([f, x]) => `<tr><td>${esc(f)}</td><td class="n">${x.n}</td><td class="n">${x.g}</td><td class="n ${x.gain - x.mise >= 0 ? "pos" : "neg"}">${euros(x.gain - x.mise)}</td></tr>`).join("") + `</table></div>`;
  }
  h += `<h2>Mes paris (${paris.length})</h2>`;
  h += paris.length ? [...paris].reverse().map(p => `<div class="carte">
      <div class="pari"><div><b>${p.type === "sport" ? "⚽ " : "🏇 "}${esc(p.formule)}</b> · ${esc(p.chevaux)}<div class="sous">${esc(p.libelle || p.course || p.cle || "")}${p.cote ? " · cote " + (+p.cote).toFixed(2) : ""}</div></div>
      <div style="text-align:right"><div>${euros(+p.mise)}</div><div class="sous ${p.gain == null ? "" : +p.gain > 0 ? "pos" : "neg"}">${p.gain == null ? "en attente" : (+p.gain > 0 ? "gagné " : "perdu ") + euros(+p.gain)}${p.auto ? " (auto)" : ""}</div></div></div>
      <div class="actions">${p.type === "sport" && p.gain == null ? `<button class="btn sec" data-gagne="${p.id}">Gagné</button><button class="btn sec" data-perdu="${p.id}">Perdu</button><button class="btn sec" data-rembourse="${p.id}">Remboursé</button>`
        : `<button class="btn sec" data-gain="${p.id}">${p.gain == null ? "Saisir le gain" : "Corriger le gain"}</button>${p.gain == null ? `<button class="btn sec" data-perdu="${p.id}">Perdu</button>` : ""}`}
        <button class="btn sec" data-suppr="${p.id}">Supprimer</button></div>
    </div>`).join("") : `<div class="vide">Aucun pari noté pour l'instant.</div>`;
  if (k.mvts.length) h += `<h2>Dépôts et retraits</h2><div class="carte"><table>` + [...k.mvts].reverse().map(m => `<tr><td>${esc(m.date)}</td><td>${m.type === "depot" ? "Dépôt" : "Retrait"}</td><td class="n ${m.type === "depot" ? "pos" : "neg"}">${euros(m.montant)}</td><td class="n"><button class="btn sec" style="padding:4px 8px" data-supmvt="${m.id}">✕</button></td></tr>`).join("") + `</table></div>`;
  h += `<h2>Sauvegarde</h2><div class="carte"><div class="deux"><button class="btn sec" id="exporter">Copier ma sauvegarde</button><button class="btn sec" id="importer">Restaurer</button></div>
    <div class="sous" style="margin-top:6px">Tes données restent sur ce téléphone. Copie ta sauvegarde de temps en temps (dans une note ou un message à toi-même) pour ne rien perdre.</div></div>`;
  vue.innerHTML = h;

  vue.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { etat.typePari = b.dataset.type; afficher(); });
  const mouvement = t => { const v = +document.getElementById("mvt").value; if (!v) return;
    const m = lsGet("yanis_compte", []); m.push({id: Date.now(), type: t, montant: v, date: new Date().toLocaleDateString("fr-FR")}); lsSet("yanis_compte", m); afficher(); };
  document.getElementById("depot").onclick = () => mouvement("depot");
  document.getElementById("retrait").onclick = () => mouvement("retrait");
  document.getElementById("okcagnotte").onclick = () => { lsSet("yanis_cagnotte", +document.getElementById("cagnotte").value || 0); afficher(); };
  document.getElementById("formpari").onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const tout = lireParis();
    if (type === "turf") {
      const cle = f.get("cle") || null;
      const c = courses.find(x => x.cle === cle);
      tout.push({id: Date.now(), type: "turf", cle, course: c ? c.txt : "Autre course", formule: f.get("formule"), mise: +f.get("mise"), chevaux: f.get("chevaux"), gain: null});
    } else {
      tout.push({id: Date.now(), type: "sport", libelle: f.get("libelle"), formule: "Sport", chevaux: f.get("chevaux"), mise: +f.get("mise"), cote: +String(f.get("cote")).replace(",", "."), gain: null});
    }
    lsSet("yanis_paris", tout); afficher();
  };
  const maj = (id, fn) => { const t = lireParis(); const p = t.find(x => x.id === +id); if (p) { fn(p); lsSet("yanis_paris", t); afficher(); } };
  vue.querySelectorAll("[data-gain]").forEach(b => b.onclick = () => {
    const v = prompt("Somme reçue sur Betclic pour ce pari (en €) :"); if (v !== null && v !== "") maj(b.dataset.gain, p => { p.gain = +v.replace(",", "."); p.auto = false; });
  });
  vue.querySelectorAll("[data-gagne]").forEach(b => b.onclick = () => maj(b.dataset.gagne, p => p.gain = Math.round(p.mise * p.cote * 100) / 100));
  vue.querySelectorAll("[data-rembourse]").forEach(b => b.onclick = () => maj(b.dataset.rembourse, p => p.gain = p.mise));
  vue.querySelectorAll("[data-perdu]").forEach(b => b.onclick = () => maj(b.dataset.perdu, p => { p.gain = 0; p.auto = false; }));
  vue.querySelectorAll("[data-suppr]").forEach(b => b.onclick = () => {
    if (confirm("Supprimer ce pari ?")) { const t = lireParis(); t.splice(t.findIndex(x => x.id === +b.dataset.suppr), 1); lsSet("yanis_paris", t); afficher(); }
  });
  vue.querySelectorAll("[data-supmvt]").forEach(b => b.onclick = () => {
    if (confirm("Supprimer ce mouvement ?")) { const m = lsGet("yanis_compte", []); m.splice(m.findIndex(x => x.id === +b.dataset.supmvt), 1); lsSet("yanis_compte", m); afficher(); }
  });
  document.getElementById("exporter").onclick = async () => {
    const txt = "YANIS:" + btoa(unescape(encodeURIComponent(JSON.stringify({paris: lireParis(), compte: lsGet("yanis_compte", []), cagnotte: lsGet("yanis_cagnotte", 0)}))));
    try { await navigator.clipboard.writeText(txt); alert("Sauvegarde copiée. Colle-la dans une note ou un message à toi-même."); }
    catch (e) { prompt("Copie ce texte et garde-le précieusement :", txt); }
  };
  document.getElementById("importer").onclick = () => {
    const txt = prompt("Colle ici ta sauvegarde Yanis :"); if (!txt) return;
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob(txt.trim().replace(/^YANIS:/, "")))));
      if (!confirm(`Restaurer ${d.paris.length} paris et ${d.compte.length} mouvements ? Les données actuelles seront remplacées.`)) return;
      lsSet("yanis_paris", d.paris); lsSet("yanis_compte", d.compte); lsSet("yanis_cagnotte", d.cagnotte || 0); afficher();
    } catch (e) { alert("Cette sauvegarde n'est pas lisible."); }
  };
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("visibilitychange", () => { if (!document.hidden) demarrer(); });
demarrer();
</script>
</body>
</html>
