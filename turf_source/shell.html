<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turf Analyste</title>
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14;--surface:#121821;--surface2:#171f2a;--raise:#1d2733;--line:#232e3b;--line2:#2c3949;--ink:#e7ecf2;--ink2:#c3ccd7;--mute:#8693a4;
--accent:#4c8dff;--accent-ink:#ffffff;--accent-soft:rgba(76,141,255,.12);--good:#2fb67c;--good-soft:rgba(47,182,124,.12);--bad:#e5484d;--bad-soft:rgba(229,72,77,.12);--warn:#d39b2a;--warn-soft:rgba(211,155,42,.13);
--sec:#2fb67c;--fort:#4c8dff;--doute:#8693a4;--chip:#171f2a;--r:10px;
--font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:var(--font)}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--surface:#ffffff;--surface2:#f7f9fb;--raise:#eef2f6;--line:#e2e7ee;--line2:#d5dce5;--ink:#111827;--ink2:#2d3748;--mute:#5d6878;
--accent:#1f5fd6;--accent-soft:rgba(31,95,214,.08);--good:#13804f;--good-soft:rgba(19,128,79,.08);--bad:#c62f34;--bad-soft:rgba(198,47,52,.08);--warn:#a86d00;--warn-soft:rgba(168,109,0,.09);--sec:#13804f;--fort:#1f5fd6;--doute:#5d6878;--chip:#eef2f6}}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font:14.5px/1.5 var(--font);font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);min-height:100vh}
header{position:sticky;top:0;z-index:5;padding:env(safe-area-inset-top) 16px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px}
h1{font-size:16px;white-space:nowrap;margin:0;font-weight:700;letter-spacing:-.2px;color:var(--ink)}
h1 span{color:var(--mute);font-weight:500}h1 small{color:var(--mute);font-weight:500;font-family:var(--mono);font-size:10.5px!important;margin-left:4px}
.datebar{display:flex;align-items:center;gap:4px}.datebar button{padding:5px 9px;font-size:13px}
#bell svg{width:15px;height:15px;vertical-align:-3px}
button{font:inherit;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--line2)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.status{font-size:11.5px;color:var(--mute);margin:6px 0 6px;display:flex;justify-content:space-between;gap:8px}
#upd{font-family:var(--mono)}
.bar{height:2px;background:var(--line);overflow:hidden;margin:0 -16px}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.modes{display:flex;gap:0;margin:10px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.modes button{flex:1;font-weight:600;font-size:13px;padding:7px 4px;border:0;border-radius:7px;background:none;color:var(--mute)}
.modes button.on{background:var(--raise);color:var(--ink)}
nav{display:flex;gap:4px;margin-top:4px}nav[hidden]{display:none}
nav button{flex:1;background:none;border:0;border-radius:0;border-bottom:2px solid transparent;color:var(--mute);padding:9px 4px;font-weight:600;font-size:13px}
nav button.on{color:var(--ink);border-color:var(--accent)}
#bellN{display:inline-block;font-size:10px;margin-left:3px;color:var(--bad);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}.chips button{white-space:nowrap;font-size:12.5px;padding:5px 11px;border-radius:7px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 40px);max-width:760px;margin:0 auto}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.card.is-live{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.card.hl{border-color:var(--line2)}
.tap{cursor:pointer}.tap:active{background:var(--surface2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ttl{font-weight:600}.mute{color:var(--mute);font-size:12.5px}
.mono{font-family:var(--mono);font-size:12.5px}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.4px;padding:2px 7px;border-radius:5px;white-space:nowrap;border:1px solid currentColor;background:none}
.SEC{color:var(--sec)}.FORT{color:var(--fort)}.DOUTE{color:var(--doute)}.NA{color:var(--mute);opacity:.8}.LOUP{color:var(--warn)}
.livesim{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12.5px;color:var(--mute)}.livesim b{color:var(--ink)}
.simbar{display:grid;grid-template-columns:48px 1fr 44px;align-items:center;gap:8px;font-size:12.5px;margin:3px 0}.simbar i{display:block;height:6px;border-radius:3px;background:var(--accent)}.simbar b{text-align:right;font-weight:600}
.risk{font-size:12px;color:var(--mute);margin-top:5px}
.vgrid{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;margin:10px 0 6px}.vgrid div{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center}.vgrid span{display:block;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}.vgrid b{font-size:18px;font-weight:600}.vgrid .win b{color:var(--good)}.vgrid .lose b{font-size:15px}
.ev{font-size:12.5px;margin:4px 0;color:var(--ink2)}
.card.pn.bad{box-shadow:inset 3px 0 0 var(--bad)}.card.pn.good{box-shadow:inset 3px 0 0 var(--good)}.card.pn.wolfc,.card.vcard{box-shadow:inset 3px 0 0 var(--warn)}
.wolf{display:block;margin:8px 0 2px;padding:6px 9px;border-radius:7px;font-size:12px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.wolf.strong{background:var(--warn-soft);color:var(--ink);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.odds{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);margin-top:7px}.odds b{color:var(--ink);font-family:var(--mono);font-weight:600}
.lprop{margin-top:7px;padding:7px 9px;border-radius:7px;background:var(--accent-soft);font-size:12.5px}.lprop b{color:var(--ink)}
.warn{color:var(--warn);font-weight:600}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:3px 12px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}.prow:first-of-type{border-top:0}.prow b{font-family:var(--mono);font-weight:600}.prow .adv{grid-column:1/-1;font-size:11.5px}
.pts{padding:8px 0;border-top:1px solid var(--line)}
.tiers{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.tiers span{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);color:var(--mute);font-family:var(--mono)}.tiers span.mid{color:var(--warn)}.tiers span.hi{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}.tiers b{color:inherit;font-weight:600}
.combo{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.combo b{color:var(--mute);font-weight:500}.combo .cm{font-family:var(--mono);color:var(--ink);font-weight:600}
.rmini{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--mute);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}.rmini em{font-style:normal;color:var(--mute);width:100%;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}.rmini b{color:var(--ink);font-family:var(--mono);font-weight:600}
.rtab .rh,.rtab .rr{display:grid;grid-template-columns:1.6fr 1fr auto;gap:8px;padding:7px 0;align-items:center;font-size:13px}
.rtab .rh{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;padding-top:0}.rtab .rh span:last-child{text-align:right}
.rtab .rr{border-top:1px solid var(--line)}.rtab .rr b{font-family:var(--mono);font-weight:600;text-align:right}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mute);margin-top:6px}.kv span:last-child{text-align:right}.kv b{color:var(--ink)}
.big{font-size:16px;font-weight:600;margin:6px 0 2px;letter-spacing:-.1px}
.conf{font-family:var(--mono);font-weight:600;color:var(--ink)}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--accent)}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:20px 0 8px;font-weight:600}
.reu{margin-bottom:14px}.reu>.row{padding:4px 2px 8px}
.crow{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.crow:first-of-type{border-top:0}
.crow .h{font-family:var(--mono);font-weight:600;width:44px;color:var(--ink2);padding-top:1px}.crow .m{flex:1;min-width:0}.crow .m>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--good);font-weight:600}.ko{color:var(--bad);font-weight:600}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 40px)}
#sheet.open{display:block}#sheet .in{max-width:760px;margin:0 auto}
.jeu{border:1px solid var(--line);padding:9px 11px;margin:6px 0;background:var(--surface);border-radius:8px}
.jeu.main{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.horse{border-top:1px solid var(--line);padding:10px 0}.horse:first-child{border-top:0}
.hn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-family:var(--mono);font-size:13px;margin-right:9px;flex:none}
.hn.b{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.why{margin:6px 0 0 37px;padding:0;list-style:none;font-size:12.5px;color:var(--ink2)}.why li{margin:2px 0}.why .p{color:var(--good)}.why .n{color:var(--bad)}
.err{border-color:var(--bad)}
.foot{font-size:11.5px;color:var(--mute);text-align:center;margin-top:24px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}.kpis b{display:block;font-size:19px;font-weight:600;font-family:var(--mono)}
.mk{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}.mk:first-child{border-top:0}
.alert{border:1px solid var(--line);padding:9px 11px;margin:6px 0;background:var(--surface);border-radius:8px;font-size:13.5px}
.inj{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}.inj:first-child{border-top:0}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--mute);margin:4px 3px 0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.chip{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;letter-spacing:.3px}
.chip.live{color:var(--bad);background:var(--bad-soft)}.chip.fin{color:var(--mute);background:var(--surface2)}.chip.pre{color:var(--ink2);background:var(--surface2);font-family:var(--mono)}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:10px 0 8px}
.board .tm{font-weight:600;font-size:14.5px;line-height:1.25}.board .tm.r{text-align:right}
.sc{font-size:20px;font-weight:600;font-family:var(--mono);white-space:nowrap;color:var(--ink)}
.vs{font-size:12px;color:var(--mute)}
.big2 .sc{font-size:28px}
.prono{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 0 0;margin-top:2px;font-size:13.5px;font-weight:500}
.tv{font-size:12px;color:var(--mute);margin-top:6px}
.strip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin:0 0 6px;background:var(--surface2);color:var(--mute);letter-spacing:.2px}
.strip.live{color:var(--bad);background:var(--bad-soft)}.strip.soon{color:var(--warn);background:var(--warn-soft)}.strip.fin{color:var(--good);background:var(--good-soft)}
.crow .strip{margin:5px 0 0}
.btn-eq{display:block;text-align:center;margin:10px 0 4px;padding:10px;border-radius:8px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--surface);border:1px solid var(--line2)}
.money{text-align:center}.money.up .big{color:var(--good)}.money.down .big{color:var(--bad)}
a{color:var(--accent)}
.card.fin{padding:10px 14px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Turf <span>Analyste</span> <small style="font-size:11px;font-weight:700">v22</small></h1>
    <div class="datebar"><button id="bell" aria-label="Alertes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><b id="bellN"></b></button><button id="prev" aria-label="Jour précédent">‹</button><button id="today">Auj.</button><button id="next" aria-label="Jour suivant">›</button></div>
  </div>
  <div class="status"><span id="st">Prêt</span><span id="upd"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="modes"><button data-m="turf" class="on">Turf</button><button data-m="sport">Sport</button><button data-m="value">Points noirs</button></div>
  <nav id="navTurf"><button data-t="sel" class="on">Sélections</button><button data-t="prog">Programme</button><button data-t="bilan">Bilan</button></nav>
  <nav id="navValue" hidden><button class="on">Faux favoris · loups · cotes trop belles</button></nav>
  <nav id="navSport" hidden><button data-t="top" class="on">Sélection</button><button data-t="list">Matchs</button><button data-t="sbilan">Bilan</button></nav>
</header>
<main id="view"></main>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<script>

</script>

<script>

</script>
</body>
</html>
